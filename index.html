<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>FORGE — Level Up Your Body</title>
<style>
  :root{
    /* v1.38 theme: dark navy (primary) · dark grey (secondary) · Spotify green (accent) */
    --bg:#060c18; --bg2:#0a1324; --card:#1c1f26; --card2:#252932; --line:#2f3440;
    --text:#eaeef4; --muted:#939db0; --accent:#1db954; --accent2:#1ed760; --accent-dim:rgba(29,185,84,.15); --on-accent:#04110a;
    --hover-line:#454b58;
    --danger:#ff5c5c; --warn:#ffb347; --info:#5cc8ff;
    --chest:#ff6b6b; --back:#4ecdc4; --shoulders:#ffd93d; --biceps:#a78bfa; --triceps:#f472b6;
    --quads:#fb923c; --hamstrings:#34d399; --glutes:#f87171; --core:#60a5fa; --calves:#c084fc;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
  input:focus,select:focus{border-color:var(--accent)}
  .cnotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
  .dash-scroll .cnotes{grid-template-columns:1fr}
  .cnotes.even{grid-template-columns:repeat(var(--cols),1fr)}
  @media(max-width:1100px){.cnotes.even{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){.cnotes.even{grid-template-columns:1fr}}
  /* My Plan: fill the window when there's room, scroll normally when there isn't */
  main.fillpage{padding-bottom:28px}
  main.fillpage .page.active{display:flex;flex-direction:column;min-height:100%}
  main.fillpage .plan-built{flex:1;display:flex;flex-direction:column}
  main.fillpage .plan-built .cnotes.even{flex:1;grid-auto-rows:minmax(84px,1fr)}
  @media(min-width:1000px){
    main.fillpage .plan-built .cnote{align-items:center;padding:14px 18px}
    main.fillpage .plan-built .cnote b{font-size:15px}
    main.fillpage .plan-built .cnote span{font-size:14px}
    main.fillpage .plan-built .cn-ic{font-size:22px;width:30px}
  }
  .cnote{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
  .cnote .cn-ic{font-size:18px;line-height:1.2;width:24px;text-align:center;flex-shrink:0}
  .cnote b{display:block;font-size:14px;margin-bottom:2px}
  .cnote span{font-size:13px;color:var(--muted);line-height:1.45}
  .plan-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .plan-stats>div{background:var(--accent-dim);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .plan-stats b{font-size:24px;font-weight:900;color:var(--accent);line-height:1.1}
  .plan-stats span{font-size:12px;color:var(--muted)}
  .askbg{position:fixed;inset:0;z-index:2100;display:none;align-items:center;justify-content:center;background:#000a;backdrop-filter:blur(3px)}
  .askbg.open{display:flex;animation:celebFade .15s ease-out}
  .askcard{width:min(420px,90vw);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 24px 20px;box-shadow:0 24px 70px #000c;animation:askPop .22s cubic-bezier(.2,1.3,.4,1)}
  @keyframes askPop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .askcard .ask-ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--accent-dim);margin-bottom:12px}
  .askcard.danger .ask-ic{background:#ff4d4d22}
  .askcard h3{font-size:19px;margin:0 0 6px}
  .askcard p{color:var(--muted);font-size:14px;margin:0}
  .askbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
  .askbtns .btn{min-width:96px}
  .wu{font-size:13px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:7px 10px;margin:0 0 10px;text-align:center}
  .wu b{color:var(--text)}
  .adjnote{font-size:13px;text-align:center;margin-top:8px;min-height:0}
  .adjnote:empty{display:none}
  .adjnote.up{color:var(--accent)} .adjnote.down{color:#ffb35c} .adjnote.ok{color:var(--muted)}
  .sets input.bumped{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);transition:box-shadow .3s}
  .celebrate{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#0008,#000c);backdrop-filter:blur(3px);overflow:hidden}
  .celebrate.open{display:flex;animation:celebFade .2s ease-out}
  @keyframes celebFade{from{opacity:0}to{opacity:1}}
  .celeb-card{position:relative;width:min(420px,90vw);background:var(--card);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:22px;padding:30px 28px 24px;text-align:center;box-shadow:0 30px 80px #000c,0 0 0 1px #ffffff08;animation:celebPop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes celebPop{0%{transform:scale(.6) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
  .celeb-glow{position:absolute;inset:-40%;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--cc) 35%,transparent),transparent 55%);pointer-events:none;animation:celebGlow 2.4s ease-in-out infinite alternate;z-index:-1}
  @keyframes celebGlow{from{opacity:.6}to{opacity:1}}
  .celeb-icon{font-size:58px;line-height:1;margin-bottom:10px;animation:celebIcon .7s cubic-bezier(.2,1.6,.4,1) .1s both;filter:drop-shadow(0 6px 18px color-mix(in srgb,var(--cc) 60%,transparent))}
  @keyframes celebIcon{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
  .celeb-kicker{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--cc)}
  .celeb-title{font-size:32px;font-weight:900;margin:4px 0 8px;line-height:1.15}
  .celeb-sub{color:var(--muted);font-size:15px}
  .celeb-sub b{color:var(--text)}
  .celeb-list{margin:14px 0 2px;text-align:left;max-height:220px;overflow:auto}
  .celeb-row{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .celeb-row i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
  .celeb-btn{margin-top:20px;width:100%;padding:12px;font-size:16px}
  .celeb-confetti{position:absolute;left:50%;top:42%;width:0;height:0;pointer-events:none;z-index:0}
  .celeb-card{z-index:1}
  .celeb-confetti i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:celebBurst 1.5s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes celebBurst{0%{transform:translate(0,0) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r));opacity:0}}
  .kit-sub{grid-column:1/-1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
  select.csel-native{display:none!important}
  .csel{display:inline-flex;align-items:center;justify-content:space-between;gap:10px;width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
  .csel:hover{border-color:var(--hover-line)}
  .csel:focus-visible,.csel.open{border-color:var(--accent);outline:none}
  .csel-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .csel-chev{flex-shrink:0;color:var(--muted);transition:transform .15s}
  .csel.open .csel-chev{transform:rotate(180deg);color:var(--accent)}
  .csel-menu{position:fixed;z-index:1000;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 40px #000c;overflow-y:auto;animation:cselIn .12s ease-out}
  .csel-menu.up{animation-name:cselUp}
  @keyframes cselIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  @keyframes cselUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .csel-opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--text)}
  .csel-opt:hover,.csel-opt.hi{background:var(--card2)}
  .csel-opt.on{color:var(--accent);font-weight:700;background:var(--accent-dim)}
  .csel-opt.on b{font-size:12px}
  .csel-opt.dis{opacity:.4;cursor:default}
  .csel-menu::-webkit-scrollbar{width:8px}.csel-menu::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  input[type=number]{-moz-appearance:textfield}
  h1,h2,h3{font-weight:700;letter-spacing:-.01em}
  h1{font-size:28px}h2{font-size:20px}h3{font-size:16px}
  .muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .accent{color:var(--accent)}
  .row{display:flex;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:12px}
  .between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
  @media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

  /* layout */
  #app{display:flex;height:100%}
  nav{width:220px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;flex-shrink:0}
  nav .logo{font-weight:900;font-size:22px;letter-spacing:.12em;padding:6px 10px 18px;color:var(--accent)}
  nav .logo span{color:var(--text);font-weight:400;font-size:11px;letter-spacing:.2em;display:block;margin-top:-2px}
  nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left;width:100%}
  nav button:hover{background:var(--card);color:var(--text)}
  nav button.active{background:var(--accent-dim);color:var(--accent)}
  nav button .ico{width:20px;text-align:center;font-size:16px}
  nav .spacer{flex:1}
  nav .ver{padding:4px 12px 2px;color:var(--muted);font-size:12px}
  nav .navupd{padding:0 4px}
  nav .navupd button{white-space:nowrap;justify-content:center;font-size:13px;padding:9px 10px;border:1px solid var(--line);color:var(--text)}
  nav .navupd button.ready{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800}
  nav .navupd button.ready:hover{background:var(--accent2);color:var(--on-accent)}
  main{flex:1;overflow:auto;padding:28px 32px 60px}
  .page{display:none}.page.active{display:block}
  .page.boxed{max-width:1000px;margin:0 auto}
  .dash-main{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px}
  .dash-side{display:flex;flex-direction:column;gap:12px}
  @media(max-width:1180px){.dash-main{grid-template-columns:1fr 1fr}.dash-body{grid-column:1/-1}}
  @media(max-width:760px){.dash-main{grid-template-columns:1fr}}
  @media(min-width:1000px) and (min-height:640px){
    main.fit{overflow:hidden;padding-bottom:24px}
    main.fit .page.active{display:flex;flex-direction:column;height:100%}
    main.fit .dash-main{flex:1;min-height:0;grid-template-columns:1.25fr 1fr 1fr}
    main.fit .dash-body{grid-column:auto}
    main.fit .dash-main>*{min-height:0}
    main.fit .dash-body,main.fit .dash-scroll{display:flex;flex-direction:column}
    main.fit .dash-side>.dash-scroll{flex:1;min-height:0}
    main.fit .bm-fit{flex:1;min-height:0;display:flex;flex-direction:column}
    main.fit .bm-fit .bodymap{flex:1;min-height:0;height:100%;max-width:none}
    main.fit .scrollin{flex:1;min-height:0;overflow:auto;padding-right:4px}
  }
  .prog-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;grid-template-areas:"body body" "strength strength" "levels weight" "prs photos" "recent recent"}
  .pg-body{grid-area:body}.pg-strength{grid-area:strength}.pg-levels{grid-area:levels}.pg-weight{grid-area:weight}.pg-prs{grid-area:prs}.pg-photos{grid-area:photos}.pg-recent{grid-area:recent}
  .prog-grid .card{margin:0!important}
  .pg-strength>.card,.pg-photos>.card{height:100%}
  @media(max-width:760px){.prog-grid{grid-template-columns:1fr;grid-template-areas:"body" "strength" "levels" "weight" "prs" "photos" "recent"}}
  @media(min-width:1280px) and (min-height:680px){
    main.fit .prog-grid{flex:1;min-height:0;grid-template-columns:1.25fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr;grid-template-areas:"body strength weight photos" "body levels prs recent"}
    main.fit .prog-grid>*{min-height:0}
    main.fit .prog-grid .card{display:flex;flex-direction:column;min-height:0;overflow:auto}
    main.fit .pg-strength,main.fit .pg-photos{display:flex;flex-direction:column}
    main.fit .pg-strength>.card,main.fit .pg-photos>.card{flex:1}
    main.fit .pg-body .bm-fit{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
    main.fit .pg-body .bodymap{flex:1;min-height:0;height:100%;max-width:none}
    main.fit .prog-grid .scrollin{flex:1;min-height:0;overflow:auto;padding-right:4px}
    main.fit .chartwrap{flex:1;min-height:120px;display:flex;align-items:center}
    main.fit .chartwrap .chartsvg{width:100%;height:100%;max-height:100%}
    main.fit .prog-grid table{font-size:13px}
    main.fit .prog-grid th,main.fit .prog-grid td{padding:8px 8px}
  }
  .pg-levels .scrollin{container-type:inline-size}
  .scrollin::-webkit-scrollbar{width:8px}.scrollin::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
  .phone-only{display:none!important}
  .sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5b6472;margin-right:6px;vertical-align:middle}
  .sync-dot.ok{background:var(--accent);box-shadow:0 0 8px var(--accent)} .sync-dot.syncing{background:#4fc3f7;animation:celebGlow .8s infinite alternate}
  .sync-dot.offline{background:#ffb35c} .sync-dot.error{background:var(--danger)}
  .more-item{justify-content:flex-start;gap:12px;padding:12px 14px;width:100%}
  .more-item small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .more-item.on{border-color:var(--accent)}
  .mi-ic{width:28px;text-align:center;font-size:18px}
  /* ---------- phone layout (v1.37) ---------- */
  @media(max-width:760px){
    /* tab bar sits low: only part of the home-bar safe area is kept free (icons stay just above the home indicator) */
    :root{--navpad:0px}
    body{padding-top:env(safe-area-inset-top)}
    #app{flex-direction:column}
    nav{position:fixed;left:0;right:0;bottom:0;z-index:50;width:100%;flex-direction:row;justify-content:space-around;align-items:stretch;gap:0;
        padding:4px 4px var(--navpad);border-right:none;border-top:1px solid var(--line);background:rgba(6,12,24,.96);backdrop-filter:blur(12px)}
    nav .logo,nav .spacer,nav .ver,nav .navupd{display:none!important}
    nav button{flex:1;width:auto;flex-direction:column;gap:2px;padding:6px 2px 2px;font-size:10.5px;font-weight:600;border-radius:12px;justify-content:center;align-items:center;text-align:center}
    nav button .ico{font-size:19px;width:auto}
    nav button[data-page="guide"],nav button[data-page="achievements"],nav button[data-page="patchnotes"],nav button[data-page="settings"]{display:none}
    .phone-only{display:flex!important}
    body.no-profile nav{display:none!important}
    body.no-profile main{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}
    main{padding:14px 12px calc(70px + var(--navpad))!important}
    main.fit,main.fillpage{overflow:auto!important}
    input,select,textarea,.csel{font-size:16px}
    .pagehead h1{font-size:26px}
    .card{padding:14px}
    .grid3{grid-template-columns:1fr!important}
    .stat-grid{grid-template-columns:1fr 1fr!important}
    .settings-grid .grid2{grid-template-columns:1fr 1fr}
    .wk-shell{padding:10px;border-radius:16px}
    .page.boxed{max-width:none}
    .ex{padding:12px}
    .ex .head{flex-wrap:wrap}
    .ex .head>div:first-child{flex:1 1 100%}
    .ex .head .row{flex-wrap:wrap}
    .sets{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 46px!important;justify-content:stretch!important;gap:8px}
    .sets input{padding:10px 6px;height:44px}
    .sets .chk{width:44px;height:44px}
    .setno{width:34px;height:44px}
    .finishbox{max-width:none}
    .pick-grid{grid-auto-rows:auto!important}
    .pickday ul{display:none}
    .dash-main{grid-template-columns:1fr!important}
    .prog-grid{grid-template-columns:1fr!important;grid-template-areas:"body" "strength" "levels" "weight" "prs" "photos" "recent"!important}
    .plan-stats{grid-template-columns:1fr 1fr 1fr;gap:6px}
    .plan-stats b{font-size:18px}
    .cnotes.even{grid-template-columns:1fr!important}
    .modal{padding:20px;border-radius:18px;max-height:85vh}
    .toast{bottom:calc(76px + var(--navpad))!important}
    .celeb-card{padding:24px 18px 18px}
  }

  /* components */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .card.pad0{padding:0;overflow:hidden}
  .card h3{margin-bottom:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:700;background:var(--card2);border:1px solid var(--line);transition:.15s}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent2)}
  .btn.danger{color:var(--danger);border-color:rgba(255,92,92,.4)}
  .btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger);font-weight:800}
  .btn.danger.solid:hover{filter:brightness(1.1)}
  .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
  .btn.block{width:100%}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
  .pill.acc{background:var(--accent-dim);color:var(--accent);border-color:transparent}
  .bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
  .label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.03em}
  .field{display:flex;flex-direction:column}
  .choice{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .choice button{padding:12px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:600;text-align:center}
  .choice button small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
  .choice button.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
  .choice button.on small{color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
  th{color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:99;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .levelring{position:relative;width:120px;height:120px;flex-shrink:0}

  .levelring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .levelring .num b{font-size:34px;line-height:1}
  .mus{display:flex;align-items:center;gap:10px;padding:8px 0}
  .mus .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .mus .name{width:92px;font-weight:600;font-size:14px}
  .mus .lvl{width:46px;text-align:right;font-weight:800;font-size:13px}
  .mus .tierpill{width:74px;text-align:center}
  .mus .bar{flex:1;min-width:60px}
  .dash-scroll .scrollin{container-type:inline-size}
  @container (max-width:380px){.mus .tierpill{display:none}}
  .ex{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg2);margin-bottom:10px}
  .ex .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}

  .sets{display:grid;grid-template-columns:30px 92px 72px 40px;justify-items:center;gap:8px;align-items:center;justify-content:start}
  .exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px;margin-bottom:14px;align-items:stretch}
  .ex .head .pill{white-space:nowrap}
  .finishbox{max-width:420px;margin:0 auto;text-align:center}
  .wk-head{margin-bottom:12px}
  .wk-shell{padding:16px;background:var(--bg2);border-radius:20px;flex:1;display:flex;flex-direction:column}
  .page.boxed.active{display:flex;flex-direction:column;min-height:100%}
  main.wk{padding-bottom:28px}
  .wk-shell .finishbox{width:100%}
  .wk-shell .exgrid{margin:auto 0;padding:2px 0 14px}
  .wk-shell > .card:last-child:not(.finishbox){margin:auto 0}
  .ex .sets{justify-content:center}
  .ex .setbtns{justify-content:center}
  .wk-shell .card,.wk-shell .ex{background:var(--card)}
  .wk-shell .pagehead{margin-bottom:14px}
  .setno{width:30px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-weight:700;font-size:13px;color:var(--muted)}
  .page.boxed{container-type:inline-size}
  .page.boxed .exgrid{grid-template-columns:1fr}
  @container (min-width:860px){
    .page.boxed .exgrid{grid-template-columns:1fr 1fr}
    .page.boxed .exgrid > :last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
  }
  .restmini{display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .exgrid .ex{margin:0}
  .sets .h{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .sets input{padding:8px 10px;text-align:center}
  .sets .chk{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted)}
  .sets .chk.done{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .ach{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
  .ach .ic{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--card)}
  .ach.locked{opacity:.4;filter:grayscale(1)}
  .note{border-left:3px solid var(--accent);background:var(--accent-dim);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px}
  .changelog .entry{padding:16px 0;border-bottom:1px solid var(--line)}
  .changelog .entry:last-child{border-bottom:none}
  .changelog .tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;margin-right:6px;text-transform:uppercase}
  .tag.new{background:rgba(29,185,84,.18);color:var(--accent)}
  .tag.fix{background:rgba(92,200,255,.18);color:var(--info)}
  .tag.change{background:rgba(255,179,71,.18);color:var(--warn)}
  .changelog li{margin:6px 0 6px 4px;list-style:none;font-size:14px}
  .daycard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg2)}
  .daycard.today{border-color:var(--accent)}
  .wk-shell > .wk-pick{margin:0!important;flex:1;display:flex;flex-direction:column}
  .pick-grid{flex:1;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));grid-auto-rows:1fr}
  .pickday{text-align:left;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s;padding:16px}
  .pickday:hover{border-color:var(--hover-line);background:var(--card2)}
  .pickday.today:hover{border-color:var(--accent)}
  .pickday .pd-name{font-size:17px}
  .pd-mus{display:flex;flex-wrap:wrap;gap:6px}
  .pd-mus span{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .pd-mus i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .pickday ul{margin-top:0;flex:1}
  .pd-go{font-size:13px;font-weight:700;color:var(--muted);text-align:right;margin-top:auto}
  .pickday:hover .pd-go,.pickday.today .pd-go{color:var(--accent)}
  .daycard ul{list-style:none;margin-top:8px}
  .daycard li{font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
  .daycard li:last-child{border-bottom:none}
  .daycard li span:last-child{white-space:nowrap;flex-shrink:0}
  .xp-pop{position:fixed;pointer-events:none;font-weight:900;color:var(--accent);animation:pop 1.1s ease-out forwards;z-index:98;font-size:18px}
  @keyframes pop{0%{opacity:0;transform:translateY(0) scale(.8)}20%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-50px) scale(1)}}
  .radar{width:100%;max-width:320px;margin:0 auto;display:block}
  .timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:26px}
  .stat{text-align:center}.stat b{font-size:26px;display:block;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}
  .onb{max-width:680px;margin:30px auto}
  .onb .step{display:none}.onb .step.active{display:block}
  .steps{display:flex;gap:6px;margin-bottom:22px}.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--accent)}
  .maint{padding:12px 0;border-bottom:1px solid var(--line)}.maint:last-child{border-bottom:none}
  .maint ul{margin:6px 0 0 18px}.maint li{font-size:13px;margin:3px 0;color:var(--muted)}
  /* custom title bar (desktop app only) */
  #titlebar{display:none}
  body.frameless #titlebar{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);-webkit-app-region:drag;user-select:none;flex-shrink:0}
  body.frameless #titlebar .tb-logo{font-weight:900;letter-spacing:.14em;font-size:13px;color:var(--accent)}
  body.frameless #titlebar .tb-sub{font-size:12px;color:var(--muted)}
  body.frameless #titlebar .tb-right{margin-left:auto;margin-right:140px;display:flex;align-items:center;gap:8px}
  body.frameless #titlebar button{-webkit-app-region:no-drag}
  body.frameless{display:flex;flex-direction:column}
  body.frameless #app{flex:1;height:auto;min-height:0}
  body.frameless nav .logo{display:none}
  body.frameless nav{padding-top:14px}
  .chartsvg{width:100%;height:auto;display:block}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--accent-dim);color:var(--accent)}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .photos .ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;background:var(--bg2);cursor:pointer}
  .photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .photos .ph span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:11px;background:rgba(0,0,0,.6)}
  .gcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg2);cursor:pointer;text-align:left;width:100%}
  .gcard:hover{border-color:var(--muted)}
  .guide ul{margin:6px 0 0 18px}.guide li{margin:4px 0;font-size:14px}
  .timerbtns{display:flex;gap:4px;margin-top:4px;justify-content:center}.timerbtns button{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
  .timerbtns button:hover{color:var(--text);border-color:var(--muted)}
  .bodymap{width:100%;max-width:680px;margin:0 auto;display:block}
  .bm-r{cursor:pointer;transition:stroke .15s, fill-opacity .15s}
  .bm-r:hover{fill-opacity:1;filter:brightness(1.25)}
  .bm-b{pointer-events:none}
  .tierpill{font-size:10px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:6px;text-transform:uppercase}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
</style>
</head>
<body>
<div id="titlebar"><span class="tb-logo">FORGE</span><span class="tb-sub" id="tb-sub"></span><div class="tb-right"><span class="pill acc" id="tb-lvl" style="display:none"></span></div></div>
<div id="app">
  <nav id="nav">
    <div class="logo">FORGE<span>LEVEL UP YOUR BODY</span></div>
    <div class="spacer"></div>
    <button data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="workout"><span class="ico">⚡</span>Workout</button>
    <button data-page="plan"><span class="ico">▦</span>My Plan</button>
    <button data-page="progress"><span class="ico">↗</span>Progress</button>
    <button data-page="guide"><span class="ico">?</span>Guide</button>
    <button data-page="achievements"><span class="ico">★</span>Achievements</button>
    <button data-page="patchnotes"><span class="ico">✎</span>Patch Notes</button>
    <button data-page="settings"><span class="ico">⚙</span>Settings</button>
    <button id="nav_more" class="phone-only" onclick="moreSheet()"><span class="ico">☰</span>More</button>
    <div class="spacer"></div>
    <div class="navupd" id="navupd"></div>
    <div class="ver" id="navver"></div>
  </nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modal"><div class="modal" id="modalInner"></div></div>
<div class="celebrate" id="celebrate"></div>
<div class="askbg" id="ask"></div>

<script>
/* =========================================================
   FORGE — gamified workout app. Single file, all data local.
   Sections: 1 Constants & data  2 Storage  3 Plan generator
             4 Gamification  5 UI pages  6 Boot
   ========================================================= */

// ---------- 1. CONSTANTS & DATA ----------
const APP_VERSION = "1.38.3";

const CHANGELOG = [
  { version:"1.38.3", date:"2026-11-11", title:"iPhone tab bar at the very bottom", notes:[
    ["change","The iPhone tab bar now sits flush with the bottom of the screen."],
  ]},
  { version:"1.38.2", date:"2026-11-11", title:"iPhone tab bar even lower", notes:[
    ["change","The iPhone tab bar sits even lower, right down at the bottom of the screen."],
  ]},
  { version:"1.38.1", date:"2026-11-11", title:"Darker navy + lower iPhone tab bar", notes:[
    ["change","The navy background is darker."],
    ["change","On iPhone the bottom tab bar now sits lower, closer to the bottom edge, while staying clear of the home bar line."],
  ]},
  { version:"1.38.0", date:"2026-11-11", title:"New colours: navy, grey & green", notes:[
    ["change","New colour scheme: dark navy backgrounds, dark grey cards and panels, and a Spotify-style green accent for buttons, highlights and progress bars."],
    ["change","The Forged muscle tier (Lv 20–34) now uses the same green."],
  ]},
  { version:"1.37.1", date:"2026-11-11", title:"Sync connected to your Firebase", notes:[
    ["new","FORGE is now connected to your own Firebase project (forge-20852), so there's nothing to paste: go to Settings → Sync, enter your email and a password, and choose Create sync account."],
  ]},
  { version:"1.37.0", date:"2026-11-11", title:"FORGE on your iPhone + sync", notes:[
    ["new","FORGE runs on your iPhone as a home-screen app: open the link in Safari, then Share → Add to Home Screen. It opens full-screen with its own icon and works offline."],
    ["new","Phone layout: bottom tab bar (Dashboard, Workout, My Plan, Progress, More), one-column screens, big tick buttons and number boxes that don't zoom the page."],
    ["new","Sync between your PC and phone through your own free Firebase account (Settings → Sync). Workouts from every device are kept; profile, XP, plan and settings follow your latest change. Works offline and catches up when you're back online."],
    ["new","A workout you start on one device shows up on the other, so you can start on the PC and finish on your phone."],
    ["change","Reset everything now also signs that device out of sync, so a reset never touches your sync account."],
  ]},
  { version:"1.36.0", date:"2026-11-11", title:"My Plan fills the window", notes:[
    ["change","My Plan now uses the whole window: your training days on top, and How this plan was built stretches down to the bottom with its tips laid out in even rows (no lone card left on its own row). If there are more tips than fit, they scroll inside the box."],
  ]},
  { version:"1.35.0", date:"2026-11-11", title:"Full-size day picker", notes:[
    ["change","When no workout is running, the day picker now fills the whole Workout panel. Each day card shows its full exercise list with sets and reps, the muscles it trains, total sets and roughly how long it takes."],
  ]},
  { version:"1.34.0", date:"2026-11-11", title:"Own dialogs & clearer coach notes", notes:[
    ["change","Confirm pop-ups (discard workout, regenerate plan, delete photo, restore backup, reset everything) are now FORGE's own dark dialogs instead of the Windows box. Enter confirms, Esc cancels; for risky actions the safe button is the default."],
    ["change","Coach notes and How this plan was built are easier to read: each tip has an icon, a short heading and one line underneath, instead of blocks of text."],
    ["change","How this plan was built now shows weekly sets per muscle, sessions per muscle and the rep range as three stat tiles at the top."],
    ["change","Notes always match your current settings, e.g. after changing equipment or session size."],
  ]},
  { version:"1.33.0", date:"2026-11-11", title:"Set-to-set progression", notes:[
    ["new","FORGE now adjusts during the workout. Tick a set and if your reps land above the target range, the remaining sets of that exercise go up a jump (two jumps if you beat the range by 3+). If they land below it, they drop about 5–10%. A note under the exercise says what changed. Based on autoregulation research (APRE), which matched or beat fixed weights for strength."],
    ["new","Change a set's weight and the sets below it that you haven't done yet update to match, so you don't retype it every set."],
    ["new","A short warm-up (about 50% × 8, then 80% × 3) is suggested before the first big lift of each session. It isn't logged and doesn't count for XP."],
    ["new","An effort tip at the top of each workout: how many reps short of failure to stop, based on your goal."],
    ["new","Both can be switched off in Settings → Workout. FORGE still uses straight sets: studies found pyramids no better for strength or size."],
  ]},
  { version:"1.32.1", date:"2026-11-11", title:"Fix: achievement pop-up text", notes:[
    ["fix","The Tonnage and Heavy Industry achievement pop-ups showed a line of code instead of their description. They now read e.g. \"Lift 5,000 kg total volume in one session\"."],
  ]},
  { version:"1.32.0", date:"2026-11-11", title:"Gym machines & celebrations", notes:[
    ["new","Level ups and achievements now get their own pop-up with a confetti burst and a short chime: overall level ups (and new ranks), muscle level ups (new tiers called out, e.g. Chest → Gold), and every achievement, from workouts, photos, weigh-ins and max tests. Several in a row show one after another. The chime follows your Timer sound setting."],
    ["new","32 machine and cable exercises, covering the kit you'll find in PureGym and The Gym Group: chest press (flat and incline), pec deck, reverse pec deck, shoulder press, lateral raise machine, seated row, plate-loaded rows, arm curl machine, seated dip and triceps extension machines, hack squat, Smith machine squat / bench / shoulder press / calf raise, seated leg curl, hip abductor and adductor, glute kickback and hip thrust machines, ab crunch and torso rotation machines, back extension, captain's chair knee raise, leg press calf raise, and cable curls, lateral raises, overhead extensions and straight-arm pulldowns."],
    ["new","Every new exercise has a written Guide entry, a starting-weight estimate and progressive overload, and shows up in Swap and in new plans when you have the machine."],
    ["new","The equipment checklist has a new Machines section with 13 machines to tick. If your equipment was set to Full gym, they're all ticked for you."],
    ["change","Assisted pull-up and dip machines aren't included: on those, more weight makes the exercise easier, so FORGE's add-weight progression would work backwards."],
  ]},
  { version:"1.31.0", date:"2026-11-11", title:"Centred sidebar", notes:[
    ["change","The sidebar's page buttons (Dashboard to Settings) now sit in the middle of the sidebar instead of at the top. The FORGE logo stays at the top and the update button and version at the bottom."],
    ["fix","Dropdown menus no longer close by themselves if the page is still scrolling when you open one; the menu now follows its box instead."],
  ]},
  { version:"1.30.0", date:"2026-11-11", title:"Custom dropdowns", notes:[
    ["change","Every dropdown in FORGE (strength exercise picker, photo pose, settings, max test, photo compare) now opens a FORGE-styled menu instead of the standard Windows list: dark rounded panel, green highlight and a tick on the current choice."],
    ["new","Dropdowns work with the keyboard too: arrow keys to move, Enter to choose, Esc to close."],
  ]},
  { version:"1.29.0", date:"2026-11-11", title:"Progress fits the window", notes:[
    ["change","The Progress page now fits your window without scrolling: body map on the left, then strength graph, body weight and photos on top, with muscle levels, personal records and recent workouts below."],
    ["change","Any card with more in it than fits (records, recent workouts, photos) scrolls inside its own box instead of the whole page. Smaller windows still scroll normally."],
    ["change","Recent workouts show date, session, sets and XP; hover a row for its volume and duration."],
  ]},
  { version:"1.28.0", date:"2026-11-11", title:"Centred workout content", notes:[
    ["change","When a workout doesn't fill the panel, the exercises sit centred in the space between the header and the rest + finish box. The day picker is centred the same way."],
    ["change","Inside each exercise box, the set / kg / reps / tick table and the + set / − set buttons are now centred."],
  ]},
  { version:"1.27.0", date:"2026-11-11", title:"Full-height workout panel", notes:[
    ["change","The Workout panel now runs the full height of the window, top to bottom, even when there isn't much in it, and the rest + finish box sits at the bottom of the panel."],
  ]},
  { version:"1.26.0", date:"2026-11-11", title:"Workout in one panel", notes:[
    ["change","The whole Workout tab now sits inside one large panel, with the workout header, each exercise and the rest + finish box as boxes inside it."],
  ]},
  { version:"1.25.0", date:"2026-11-11", title:"Boxed workout layout", notes:[
    ["change","Everything in the Workout tab is now in its own box: the workout name, Discard and progress bar at the top, each exercise, and the rest + finish box."],
    ["change","There's now just one rest timer, in the rest + finish box at the bottom of the workout."],
    ["change","When a workout has an odd number of exercises, the last one sits centred on its own row."],
    ["change","Set numbers sit centred in their own small boxes, lined up with the weight and reps boxes."],
  ]},
  { version:"1.24.0", date:"2026-11-11", title:"Finish box with rest timer", notes:[
    ["change","Finishing a workout now happens in its own small centred box at the bottom of the session, showing how many sets you've ticked with a progress bar above the Finish button."],
    ["new","The rest timer is in that box too, with −15 / +15 / Skip, so you don't have to scroll back up between sets. The one at the top still works."],
  ]},
  { version:"1.23.0", date:"2026-11-11", title:"Centred workout", notes:[
    ["change","The Workout tab now sits in a centred box (up to 1000px wide) instead of stretching across the whole window, with exercises in two columns."],
  ]},
  { version:"1.22.0", date:"2026-11-11", title:"Dashboard fits the window", notes:[
    ["change","The Dashboard now fits your window without scrolling: the body map scales to the space available, and Muscle levels and Coach notes have their own scroll areas if they need one."],
    ["change","Muscle levels have their own card on the Dashboard, and Coach notes show all of your plan's notes."],
    ["fix","Exercise cards in a row during a workout are now all the same height, even when one exercise has a longer description."],
    ["change","The Finish workout button is a normal-sized button on the right instead of a bar across the whole page."],
  ]},
  { version:"1.21.0", date:"2026-11-11", title:"Compact workout logging", notes:[
    ["change","The weight and reps boxes during a workout are now a compact size that fits a few digits, instead of stretching across the whole window."],
    ["change","On wide windows, exercises in an active workout sit side by side in columns (one column on narrower windows), so more of the session fits on screen."],
  ]},
  { version:"1.20.0", date:"2026-11-11", title:"Full-width layout", notes:[
    ["change","Every page now uses the full width of the window instead of a narrow centre column with empty space either side."],
    ["change","Your plan's training days, the workout day picker and the exercise Guide add more columns as the window gets wider, so a full plan fits on one row on a large screen."],
    ["change","The body map grows with its card on bigger windows."],
  ]},
  { version:"1.19.0", date:"2026-11-11", title:"Detailed anatomical body map", notes:[
    ["change","The body map now uses a professionally drawn anatomical figure with correct proportions: separated abs and serratus, multi-part shoulders and chest, individual forearm, quad, hamstring and calf strands, and traps, lats and lower back on the back view."],
    ["change","FORGE's tier colours, muscle fibres, shading and level badges are drawn on top, and hovering any muscle still shows its level and XP."],
    ["new","Credits for the anatomy artwork (MIT licence) are in Settings → About and THIRD-PARTY-NOTICES.md."],
  ]},
  { version:"1.18.0", date:"2026-11-11", title:"Anatomy-chart body map", notes:[
    ["change","The body map has been rebuilt like an anatomy chart: muscles fit together across the whole body with pointed tendon ends, instead of separate rounded shapes."],
    ["new","Many more individual muscles: three-part delts, both pec heads, serratus, the full ab wall and obliques, three quads plus sartorius and adductors, kneecaps and shins; on the back the full trapezius, infraspinatus, teres, lats, spinal erectors, glute medius and maximus, three hamstrings, both calf heads and the soleus."],
    ["change","Forearms, hands, neck, knees, shins and feet are drawn as muscle too, in neutral grey. Untrained muscle groups are now a lighter grey so they stand out from the neutral parts."],

/*
  Evidence-based defaults (see README for sources):
  - Train each muscle ~2x/week (frequency ≥2 beats 1 for hypertrophy).
  - Weekly hard sets per muscle: beginner ~10, intermediate ~14, advanced ~18 (10–20 landmark).
  - Goal → rep range / rest: strength 3–6 reps, 2–3 min; muscle 6–12, 90 s; fat loss 10–15, 60 s; general 8–12, 75 s.
  - Progression: double progression — hit top of rep range on every set → add weight next time.
  - Body type is only used as a *starting* bias; logged results override it over time.
*/
const GOALS = {
  muscle:  {name:"Build Muscle",   reps:[6,12], rest:90,  setsMul:1.0},
  strength:{name:"Get Stronger",   reps:[3,6],  rest:150, setsMul:0.9},
  fatloss: {name:"Lose Fat",       reps:[10,15],rest:60,  setsMul:1.0},
  recomp:  {name:"Body Recomposition", reps:[6,12], rest:75, setsMul:1.0},   // lose fat + gain muscle: hypertrophy stimulus, a little more density
  general: {name:"General Fitness",reps:[8,12], rest:75,  setsMul:0.85},

  ectomorph:{name:"Ectomorph",desc:"Lean, long limbs, finds it hard to gain",bias:{sets:-1,rest:+15,isoShare:0.3}},
  mesomorph:{name:"Mesomorph",desc:"Naturally athletic, gains easily",bias:{sets:0,rest:0,isoShare:0.4}},
  endomorph:{name:"Endomorph",desc:"Wider build, gains fat easily",bias:{sets:+1,rest:-15,isoShare:0.4}},

function splitFor(days){
  // returns array of day templates: each lists muscle groups for that day
  // Full-body days rotate the small muscles so sessions stay ~45–60 min (they get plenty of indirect work from compounds).
  const MAJ = ["chest","back","shoulders","quads","hamstrings","glutes"];
  const FBA = [...MAJ,"biceps","core"], FBB=[...MAJ,"triceps","calves"], FBC=[...MAJ,"biceps","calves"];
  const UP = ["chest","back","shoulders","biceps","triceps"];
  const LO = ["quads","hamstrings","glutes","calves","core"];
  const PUSH=["chest","shoulders","triceps"], PULL=["back","biceps","core"], LEGS=["quads","hamstrings","glutes","calves"];
  switch(days){
    case 2: return [{n:"Full Body A",m:FBA},{n:"Full Body B",m:FBB}];
    case 3: return [{n:"Full Body A",m:FBA},{n:"Full Body B",m:FBB},{n:"Full Body C",m:FBC}];
    case 4: return [{n:"Upper A",m:UP},{n:"Lower A",m:LO},{n:"Upper B",m:UP},{n:"Lower B",m:LO}];
    case 5: return [{n:"Upper",m:UP},{n:"Lower",m:LO},{n:"Push",m:PUSH},{n:"Pull",m:PULL},{n:"Legs",m:LEGS}];
    default: return [{n:"Push A",m:PUSH},{n:"Pull A",m:PULL},{n:"Legs A",m:LEGS},{n:"Push B",m:PUSH},{n:"Pull B",m:PULL},{n:"Legs B",m:LEGS}];
  }
}

// ---------- session top-up (v1.13) ----------
// Every session gets at least MIN_EX exercises. Short days (e.g. beginner Push/Pull on 5–6 day plans) get a
// second movement for their main muscles; the new exercise shares that muscle's sets instead of adding many.
const MIN_EX = 5;
const REAR_DELT = ["face_pull","rear_delt","prone_ytw","reverse_pec_deck"];
const DAY_PRIORITY = { push:["chest","shoulders","triceps"], pull:["back","biceps","shoulders"], legs:["quads","hamstrings","glutes","calves"],
                       upper:["chest","back","shoulders","biceps","triceps"], lower:["quads","hamstrings","glutes","calves","core"] };
function exParams(e,p){
  const goal=GOALS[p.goal]||GOALS.muscle, bt=(BODYTYPES[p.bodyType]||BODYTYPES.mesomorph).bias, age=ageTuning(p), c=e.t==="compound";
  return { reps: c? goal.reps : [Math.max(goal.reps[0],8), Math.max(goal.reps[1],12)], rest: Math.max(45, goal.rest + bt.rest + age.rest + (c?0:-30)) };
}
function topUpDay(name, exs, p){
  const kit=userKit(p), pool=EXERCISES.filter(e=>!e.adv && kitAllows(kit,e)), has=id=>exs.some(x=>x.ex===id);
  const idx=Object.fromEntries(EXERCISES.map((e,i)=>[e.id,i])), loaded=["barbell","dumbbells","cable","pulldown","legpress","legmachines"].filter(k=>kit.includes(k)).length;
  const rank=e=>idx[e.id]+((NEEDS[e.id]||[]).length?0:(loaded>=3?6:loaded>=1?3:0));
  const type=(name||"").toLowerCase().split(" ")[0];
  const add=(e,sets)=>{ const pr=exParams(e,p); exs.push({ex:e.id, sets, reps:pr.reps, rest:pr.rest}); };
  // 1) Pull days get rear-shoulder work
  if(type==="pull" && !exs.some(x=>EX[x.ex].p==="shoulders")){
    const r=pool.filter(e=>REAR_DELT.includes(e.id)).sort((a,b)=>rank(a)-rank(b))[0];
    if(r) add(r, Math.max(2, Math.min(3, ...exs.map(x=>x.sets))));
  }
  // 2) fill up to MIN_EX with a second movement for the day's main muscles, sharing their sets
  const order=(DAY_PRIORITY[type]||[...new Set(exs.map(x=>EX[x.ex].p))]).filter(m=>exs.some(x=>EX[x.ex].p===m)||m==="shoulders"&&type==="push");
  let guard=0;
  while(exs.length<MIN_EX && guard++<20){
    const counts=m=>exs.filter(x=>EX[x.ex].p===m).length;
    const m=order.filter(m=>pool.some(e=>e.p===m&&!has(e.id)&&!(type==="push"&&m==="shoulders"&&REAR_DELT.includes(e.id)))).sort((a,b)=>counts(a)-counts(b)||order.indexOf(a)-order.indexOf(b))[0];
    if(!m) break;
    const mine=exs.filter(x=>EX[x.ex].p===m);
    let cands=pool.filter(e=>e.p===m && !has(e.id));
    if(type==="push"&&m==="shoulders") cands=cands.filter(e=>!REAR_DELT.includes(e.id));
    if(type==="pull"&&m==="shoulders") cands=cands.filter(e=>REAR_DELT.includes(e.id)).concat(cands.filter(e=>!REAR_DELT.includes(e.id)&&e.t==="isolation"));
    const wantIso = mine.some(x=>EX[x.ex].t==="compound") && m!=="back";
    const pickFrom=cands.filter(e=>wantIso? e.t==="isolation" : e.t==="compound");
    const e=(pickFrom.length?pickFrom:cands).sort((a,b)=>rank(a)-rank(b))[0];
    if(!e) break;
    // share sets: the muscle's biggest exercise gives one set to the new one (never below 2)
    const donor=mine.sort((a,b)=>b.sets-a.sets)[0];
    const sets=2; if(donor && donor.sets>3) donor.sets--;
    add(e, sets);
  }
  return exs;
}
function generatePlan(p, seed){
  const rnd = mulberry32(seed||Date.now());
  const goal=GOALS[p.goal], bt=BODYTYPES[p.bodyType].bias, xp=EXPERIENCE[p.experience];
  const days = splitFor(p.days);
  const kit = userKit(p);
  const pool = EXERCISES.filter(e=>!e.adv && kitAllows(kit,e));
  // how many times each muscle appears across the week
  const freq={}; days.forEach(d=>d.m.forEach(m=>freq[m]=(freq[m]||0)+1));
  // weekly sets per muscle → sets per appearance
  const age = ageTuning(p);
  const weekly = Math.max(6, Math.round((xp.weekly*goal.setsMul + bt.sets)*age.vol));
  const sizeAdj = Math.max(-2, Math.min(0, Number(p.volumeAdj)||0));      // Session size: 0 / -1 / -2 sets per exercise
  const minor = ["biceps","triceps","calves","core"]; // smaller muscles get less direct work (they're hit indirectly)
  const big   = ["chest","back","quads"];             // the muscles that earn a second exercise on split days
  const used = {}; // exercise usage count to vary A/B days
  // preference: order in EXERCISES is "best first"; bodyweight moves are de-prioritised when better kit is available
  const idx = Object.fromEntries(EXERCISES.map((e,i)=>[e.id,i]));
  // prefer loaded movements when the kit allows them: bodyweight moves sink down the list
  const needsNothing = e => !(NEEDS[e.id]||[]).length;
  const loaded = ["barbell","dumbbells","cable","pulldown","legpress","legmachines"].filter(k=>kit.includes(k)).length;
  const penalty = e => needsNothing(e) ? (loaded>=3?6:loaded>=1?3:0) : 0;
  const plan = days.map((d,di)=>{
    const exs=[];
    const today=new Set();   // never the same exercise twice in one session
    const fullBody = d.m.length>=8;
    d.m.forEach(m=>{
      const target = Math.round((minor.includes(m)?weekly*0.6:weekly)/freq[m]);
      const n = (!fullBody && big.includes(m) && p.experience!=="beginner") ? 2 : 1;
      const setsEach = Math.max(2, Math.min(fullBody?3:4, Math.round(target/n)) + sizeAdj);
      const cands = pool.filter(e=>e.p===m);
      const comp = cands.filter(e=>e.t==="compound"), iso=cands.filter(e=>e.t==="isolation");
      const pick=(arr)=>{ arr=arr.filter(e=>!today.has(e.id)); if(!arr.length) return null; const sorted=[...arr].sort((a,b)=>((used[a.id]||0)*10+idx[a.id]+penalty(a)+rnd()*2.5)-((used[b.id]||0)*10+idx[b.id]+penalty(b)+rnd()*2.5)); const e=sorted[0]; used[e.id]=(used[e.id]||0)+1; today.add(e.id); return e; };
      for(let i=0;i<n;i++){
        const wantIso = (comp.length===0) || (m!=="back" && (i>0 || minor.includes(m) || (rnd()<bt.isoShare && i===n-1 && n>1)));
        let e = wantIso ? (pick(iso)||pick(comp)) : (pick(comp)||pick(iso));
        if(!e) continue;
        const isCompound=e.t==="compound";
        const reps = isCompound ? goal.reps : [Math.max(goal.reps[0],8), Math.max(goal.reps[1],12)];
        exs.push({ex:e.id, sets:setsEach, reps, rest: Math.max(45, goal.rest + bt.rest + age.rest + (isCompound?0:-30))});
      }
    });
    topUpDay(d.n, exs, p);
    return {name:d.n, exercises:exs};
  });
  return {days:plan, created:Date.now(), seed, goal:p.goal, weekly, v15:true, v113:true, notes:planNotes(p).map(x=>x.t+": "+x.b)};
}
function ageTuning(p){
  const a=Number(p.age)||30;
  if(a>=60) return {vol:0.8, rest:30, note:"Age 60+: about 20% less weekly volume and 30 s extra rest. Recovery takes longer, and consistency beats volume."};
  if(a>=50) return {vol:0.85,rest:20, note:"Age 50+: about 15% less weekly volume and 20 s extra rest to match recovery."};
  if(a>=40) return {vol:0.92,rest:10, note:"Age 40+: slightly less weekly volume and 10 s extra rest."};
  if(a<18)  return {vol:0.85,rest:0,  note:"Under 18: slightly lower volume. Focus on technique before load, and train with supervision where possible."};
  return {vol:1, rest:0, note:null};
}
function planNotes(p){
  // each note: [icon, short heading, one-line detail]
  const n=[], g=p.goal, N=(ic,t,b)=>n.push({ic,t,b});
  if(g==="muscle"){ N("🎯","Effort","Stop each set 1–3 reps short of failure."); N("📈","When to add weight","Hit the top of the rep range on every set, then go up next session."); }
  if(g==="strength"){ N("🎯","Effort","Keep 1–2 reps in reserve on the heavy compounds."); N("⏱️","Rest","Long rests are part of the programme. Don't rush them."); }
  if(g==="recomp"){
    N("🎯","Train for muscle","Push every set to 1–3 reps short of failure. Add weight when you top the rep range.");
    N("🍽️","Eating","Maintenance or a small deficit (about 200–300 kcal a day).");
    N("🥩","Protein","1.6–2.2 g per kg bodyweight (0.7–1 g per lb), spread over the day.");
    N("✅","It's working when","Your strength goes up while your body weight holds steady.");
    N("📅","Be patient","Slower than a bulk or cut. Judge it over 8–12 weeks with weekly weigh-ins.");
  }
  if(g==="fatloss"){ N("🍽️","Diet drives fat loss","Aim for a modest calorie deficit."); N("🥩","Protein","1.6–2.2 g per kg bodyweight (0.7–1 g per lb)."); N("🚶","Move more","Add 2–3 walks or light cardio sessions a week."); N("💪","Training's job","Hold on to the muscle you have while the fat comes off."); }
  if(g==="general") N("📅","Consistency first","Complete every planned session, then push progression.");
  const bt = p.bodyType==="ectomorph" ? "Ectomorph: a bit less volume, longer rests, more compounds. Eat in a surplus to grow."
           : p.bodyType==="endomorph" ? "Endomorph: a bit more volume with shorter rests."
           : "Only a starting point.";
  N("🧬","Body type", bt+(p.bodyType==="mesomorph"?" What you log drives the plan.":" It's only a starting point; what you log drives the plan."));
  const kit=userKit(p), sum=kitSummary(kit);
  N("🏋️","Equipment", (kit.length? (Object.values(KIT_PRESETS).some(v=>v.name===sum)? `${sum} (${kit.length} item${kit.length===1?"":"s"})` : `${kit.length} item${kit.length===1?"":"s"}: `+KIT.filter(k=>kit.includes(k[0])).map(k=>k[1]).join(", ")) : "Bodyweight only")+". Change it in Settings.");
  const at=ageTuning(p); if(at.note){ const [h,...r]=at.note.split(": "); N("🎂",h,r.join(": ")); }
  const adj=Number(p.volumeAdj)||0; if(adj<0) N("✂️","Session size",`${adj===-1?"Shorter":"Shortest"}: ${-adj} set${adj===-1?'':'s'} fewer per exercise.`);
  N("⚖️","Starting weights","Estimates from your body weight. What you log becomes the baseline.");
  N("😴","Recovery","Sleep 7–9 h and eat enough protein. Both matter more than exercise choice.");
  return n;
}
function noteList(list,even){ const cols=Math.max(2,Math.min(5,Math.ceil(list.length/3))); return `<div class="cnotes${even?" even":""}"${even?` style="--cols:${cols}"`:""}>${list.map(x=>`<div class="cnote"><span class="cn-ic">${x.ic}</span><div><b>${esc(x.t)}</b><span>${esc(x.b)}</span></div></div>`).join("")}</div>`; }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// suggested weight for an exercise using double progression
function suggestWeight(exId, reps){
  const last=S.lastWeights[exId]; if(!last) return null;
  const e=EX[exId];
  const lower=["quads","hamstrings","glutes","calves"].includes(e.p);
  if(last.allTop){
    if(imperial()){ const inc = e.t==="compound" ? (lower?10:5) : (lower?5:2.5);       // lb, matches 2.5 lb plates
      const lb=Math.round((last.w*LB+inc)/2.5)*2.5; return {w:lb/LB, up:true}; }
    const inc = e.t==="compound" ? (lower?5:2.5) : (lower?2.5:1.25);
    return {w:round25(last.w+inc), up:true};
  }
  return {w:last.w, up:false};
}
function round25(x){return Math.round(x/1.25)*1.25}

// ---------- starting weights ----------
// Rough working weight for ~8–12 reps, as a fraction of body weight, for an intermediate male lifter.
// Deliberately conservative: it's a first guess, and whatever the user logs replaces it.
const START_RATIO={machine_chest_press:0.5,incline_machine_press:0.4,smith_bench:0.5,pec_deck:0.3,machine_row:0.5,plate_row:0.4,plate_high_row:0.4,straight_arm_pd:0.2,back_ext_machine:0.5,machine_shoulder_press:0.35,smith_ohp:0.3,machine_lat_raise:0.15,cable_lat_raise:0.05,reverse_pec_deck:0.2,machine_curl:0.25,cable_curl:0.25,machine_dip:0.5,machine_tri_ext:0.3,cable_oh_ext:0.2,hack_squat:0.8,smith_squat:0.6,hip_adductor:0.4,seated_leg_curl:0.4,machine_hip_thrust:0.8,glute_kick_machine:0.3,hip_abductor:0.45,ab_crunch_machine:0.35,torso_rotation:0.3,leg_press_calf:1.0,smith_calf:0.6,bench:.6,incline_db:.2,db_bench:.24,cable_fly:.15,db_fly:.1,deadlift:1.0,row_bb:.55,pulldown:.55,cable_row:.55,row_db:.26,db_pullover:.15,
  ohp:.4,db_ohp:.17,lat_raise:.07,face_pull:.2,rear_delt:.06,bb_curl:.3,db_curl:.12,hammer:.13,incline_curl:.1,pushdown:.3,skull:.25,oh_ext:.17,kickback:.07,
  squat:.8,leg_press:1.4,leg_ext:.45,goblet:.25,db_lunge:.15,rdl:.7,leg_curl:.35,db_rdl:.25,hip_thrust:.9,db_hip_thrust:.35,cable_kick:.1,
  cable_crunch:.3,db_side_bend:.2,calf_stand:.8,calf_seat:.5,db_calf:.2};
const BARBELL=new Set(["bench","squat","ohp","row_bb","rdl","deadlift","hip_thrust"]);   // can't go below an empty Olympic bar
function startSuggestion(exId){
  const e=EX[exId], p=S.profile, r=START_RATIO[exId];
  if(e.eq==="body" || r==null) return {bw:true, w:0};
  if(!p || !p.weight) return null;
  const lower=["quads","hamstrings","glutes","calves"].includes(e.p);
  let m={beginner:.6,intermediate:1,advanced:1.35}[p.experience]||1;
  if(p.sex==="female") m*= lower?.85:.65; else if(p.sex==="other") m*= lower?.92:.82;
  m*= ({strength:1.15,fatloss:.85,recomp:.95}[p.goal]||1);
  const a=Number(p.age)||30; if(a>=60) m*=.85; else if(a>=50) m*=.9; else if(a<18) m*=.8;
  let kg=p.weight*r*m; if(BARBELL.has(exId)) kg=Math.max(kg,20);
  if(imperial()){ const lb=Math.max(5,Math.round(kg*LB/5)*5); return {w:lb/LB, start:true}; }
  const step=e.eq==="dumbbell"?2:2.5; return {w:Math.max(step,Math.round(kg/step)*step), start:true};
}
// what to suggest for an exercise: progression from what was logged, else a first estimate
// ---------- progression (v1.11) ----------
// Built on S.lastSets[exId] = {sets:[{w,reps}], date}: every set you did the last time you did that exercise.
const TIMED=new Set(["plank","wall_sit","handstand_hold","superman"]);            // "reps" are seconds
const NEXT_BW={pushup:"decline_pushup",decline_pushup:"archer_pushup",pike_pushup:"elev_pike",bench_dip:"diamond",
  door_row:"inv_row",inv_row:"pullup",towel_curl:"chinup_bi",bw_squat:"split_squat",split_squat:"pistol",
  glute_bridge:"step_up",sl_bridge:"nordic"};
const BW_UPGRADE=15, TIMED_UPGRADE=60;
const DEFAULT_JUMPS={kg:{bar:2.5,db:2}, lb:{bar:5,db:5}};
const JUMP_OPTIONS={kg:{bar:[0.5,1,1.25,2.5,5],db:[1,1.25,2,2.5]}, lb:{bar:[1,2.5,5,10],db:[2.5,5]}};
function isDumbbell(e){ return (NEEDS[e.id]||[]).includes("dumbbells"); }
function jumpFor(e){ const u=wUnit(), J=Object.assign({},DEFAULT_JUMPS[u],(S.profile&&S.profile.jumps&&S.profile.jumps[u])||{}); return isDumbbell(e)?J.db:J.bar; }  // display units
const toD=kg=>imperial()?kg*LB:kg, fromD=d=>imperial()?d/LB:d, roundTo=(x,st)=>Math.round(x/st)*st;
function isBW(e){ return e.eq==="body" || START_RATIO[e.id]==null; }
function lastFor(id){ const l=S.lastSets&&S.lastSets[id]; return l&&l.sets&&l.sets.length?l:null; }
// the weight you did most sets with (ties → heavier): copes with ramping up or dropping weight mid-exercise
function workingWeight(sets){ const c={}; sets.forEach(x=>{const k=Math.round(x.w*1000)/1000; c[k]=(c[k]||0)+1;});
  let best=0,n=-1; Object.entries(c).forEach(([w,k])=>{w=+w; if(k>n||(k===n&&w>best)){best=w;n=k;}}); return best; }
const sameW=(a,b)=>Math.abs(a-b)<0.01;
function progressFor(id, reps, nSets){
  const e=EX[id], L=lastFor(id), lo=reps[0], hi=reps[1], timed=TIMED.has(id);
  const T=latestTest(id);
  if(T && !isBW(e) && (!L || T.date>L.date)){                          // fresh max test → weight that leaves ~3 reps in reserve at the bottom of the range
    const j=jumpFor(e); return {w:fromD(roundTo(toD(T.e1rm/(1+(lo+3)/30)),j)), fromTest:true, targets:Array(nSets).fill(lo), last:L};
  }
  if(!L){ const st=startSuggestion(id); if(!st) return null; return Object.assign(st,{targets:Array(nSets).fill(st.bw&&timed?20:lo)}); }
  const sets=L.sets, W=workingWeight(sets);
  if(W<=0 && isBW(e)){                                                  // bodyweight: progress reps, then a harder version
    const top=timed?TIMED_UPGRADE:Math.max(hi,BW_UPGRADE), step=timed?5:1;
    const targets=Array.from({length:nSets},(_,i)=>Math.min(top,(sets[i]||sets[sets.length-1]).reps+step));
    const ready=sets.length>=nSets && sets.every(x=>x.reps>=top);
    const nx=NEXT_BW[id], upgrade=(ready&&nx&&kitAllows(userKit(),EX[nx]))?nx:null;
    return {bw:true,w:0,targets,ready,upgrade,last:L};
  }
  const atW=sets.filter(x=>sameW(x.w,W)), dropped=sets.some(x=>x.w<W-0.01);
  if(!dropped && atW.length>=nSets && atW.every(x=>x.reps>=hi)){         // every set topped out → add weight
    const lower=["quads","hamstrings","glutes","calves"].includes(e.p), j=jumpFor(e);
    const inc=(e.t==="compound"&&lower)?2*j:j;
    return {w:fromD(roundTo(toD(W)+inc,j)),up:true,targets:Array(nSets).fill(lo),last:L};
  }
  const targets=Array.from({length:nSets},(_,i)=>{const x=sets[i]; const r=(x&&sameW(x.w,W))?x.reps+1:lo; return Math.max(lo,Math.min(hi,r));});
  return {w:W,up:false,targets,last:L};
}
// did this session beat the last one? heavier working weight, or more total reps at the same weight
function beatLast(prev,cur){
  const W0=workingWeight(prev), W1=workingWeight(cur);
  if(W1>W0+0.01) return true;
  if(!sameW(W0,W1)) return false;
  const r=a=>a.filter(x=>sameW(x.w,W0)).reduce((t,x)=>t+x.reps,0);
  return r(cur)>r(prev);
}
function ago(t){ const d=Math.floor((new Date().setHours(0,0,0,0)-new Date(t).setHours(0,0,0,0))/864e5); return d<=0?"today":d===1?"yesterday":d+" days ago"; }
function lastText(e){
  const L=e.sug&&e.sug.last; if(!L) return "";
  const t=TIMED.has(e.ex)?"s":"", ws=L.sets.map(x=>x.w);
  const body = ws.every(w=>sameW(w,ws[0]))
    ? (ws[0]>0? fmtW(ws[0])+" × ":"")+L.sets.map(x=>x.reps+t).join(", ")
    : L.sets.map(x=>(x.w>0?wDisp(x.w)+"×":"")+x.reps+t).join(", ")+(ws.some(w=>w>0)?" ("+wUnit()+")":"");
  return "Last: "+body+" · "+ago(L.date);
}
function suggestFor(exId,reps,nSets){ return progressFor(exId,reps,nSets||3); }
function sugText(e){
  const s=e.sug, each=isDumbbell(EX[e.ex])?" each":"", u=TIMED.has(e.ex)?" s":" reps";
  if(!s) return "First time";
  if(!s.targets || !s.targets.length) return s.bw? "Bodyweight" : (s.up?"▲ Go up: ":"Target ")+fmtW(s.w)+each;   // workout started before v1.11
  if(s.bw) return s.last? "Aim: "+s.targets.join(" · ")+u : "Bodyweight · start at "+s.targets[0]+u;
  if(s.start) return "Start: "+fmtW(s.w)+each+" (estimate)";
  if(s.fromTest) return "🎯 From your max: "+fmtW(s.w)+each+" × "+s.targets[0]+"+";
  if(s.up) return "▲ Go up: "+fmtW(s.w)+each+" × "+s.targets[0]+"+";
  return "Aim: "+fmtW(s.w)+each+" × "+s.targets.join(" · ");
}

// ---------- units ----------
// Everything is STORED in kg and cm. These helpers convert only for display and input.
const LB=2.2046226218;
const imperial=()=>!!(S.profile&&S.profile.wUnit==="lb");   // true = weights in lb
const wUnit=()=>imperial()?"lb":"kg";
const trim1=x=>Math.round(x*10)/10;
function wDisp(kg){ if(kg==null||kg==="") return ""; return imperial()? Math.round(kg*LB*2)/2 : trim1(kg); }   // lb to nearest 0.5
function wStore(v){ v=Number(v)||0; return imperial()? v/LB : v; }
function fmtW(kg){ return wDisp(kg)+" "+wUnit(); }
function fmtVol(kg){ return Math.round(imperial()?kg*LB:kg).toLocaleString()+" "+wUnit(); }
function cmToFtIn(cm){ let t=Math.round((Number(cm)||0)/2.54), ft=Math.floor(t/12); return [ft,t-ft*12]; }
function fmtH(cm,hUnit){ if(!cm) return "—"; if(hUnit==="ftin"){const [f,i]=cmToFtIn(cm); return f+"′"+i+"″";} return Math.round(cm)+" cm"; }
// height/weight form fields for given units (u = {w:"kg"|"lb", h:"cm"|"ftin"}); values in and out are always cm/kg
function bodyFields(prefix,u,cm,kg){
  const imp=u.w==="lb", [f,i]=cmToFtIn(cm);
  const h = u.h==="ftin"
    ? `<div class="field"><label class="label">Height (ft / in)</label><div class="row" style="gap:8px"><input id="${prefix}_hft" type="number" min="3" max="8" value="${cm?f:''}" placeholder="5"><input id="${prefix}_hin" type="number" min="0" max="11" value="${cm?i:''}" placeholder="10"></div></div>`
    : `<div class="field"><label class="label">Height (cm)</label><input id="${prefix}_height" type="number" value="${cm?Math.round(cm):''}" placeholder="178"></div>`;
  const wv = kg ? (imp? Math.round(kg*LB*2)/2 : trim1(kg)) : '';
  const w = `<div class="field"><label class="label">Weight (${imp?'lb':'kg'})</label><input id="${prefix}_weight" type="number" step="0.1" value="${wv}" placeholder="${imp?'165':'75'}"></div>`;
  return h+w;
}
function readBody(prefix,u){
  const imp=u.w==="lb", out={};
  if(u.h==="ftin"){ const f=$("#"+prefix+"_hft"), i=$("#"+prefix+"_hin"); if(f){ const t=(Number(f.value)||0)*12+(Number(i.value)||0); out.height=t?Math.round(t*2.54*10)/10:0; } }
  else { const h=$("#"+prefix+"_height"); if(h) out.height=Number(h.value)||0; }
  const w=$("#"+prefix+"_weight"); if(w){ const v=Number(w.value)||0; out.weight=v?(imp?v/LB:v):0; }
  return out;
}

// ---------- 4. GAMIFICATION ----------
function xpForLevel(l){ return Math.round(100*Math.pow(l,1.6)); }       // xp needed to go from l→l+1
function levelFromXp(xp){ let l=1,acc=0; while(xp>=acc+xpForLevel(l)){acc+=xpForLevel(l);l++;} return {lvl:l,into:xp-acc,need:xpForLevel(l),pct:(xp-acc)/xpForLevel(l)}; }
function totalXp(s){ return Object.values(s.xp).reduce((a,b)=>a+b,0); }
function rankFor(lvl){ let r=RANKS[0][1]; RANKS.forEach(([l,n])=>{if(lvl>=l)r=n}); return r; }
function weekKey(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt.getTime(); }
function weekStreak(s){
  if(!s.workouts.length) return 0;
  const weeks=new Set(s.workouts.map(w=>weekKey(w.date)));
  let k=weekKey(Date.now()), streak=0;
  if(!weeks.has(k)) k-=7*864e5; // current week not yet trained doesn't break the streak
  while(weeks.has(k)){streak++;k-=7*864e5;}
  return streak;
}
function est1rm(w,r){ return r===1?w: w*(1+r/30); } // Epley

// Award XP for a finished workout. Returns summary for the modal.
function finishWorkout(active){
  const gained={}, prs=[], beat=[]; let volume=0, setsDone=0;
  const add=(m,v)=>{gained[m]=(gained[m]||0)+v};
  active.exercises.forEach(ex=>{
    const e=EX[ex.ex]; const done=ex.sets.filter(s=>s.done && s.reps>0);
    if(!done.length) return;
    let allTop=true, topW=0;
    done.forEach(s=>{
      setsDone++; volume+=s.w*s.reps;
      let setXp = 12 + Math.min(8, Math.round(s.reps/2));            // base per hard set
      if(s.w>0) setXp += Math.min(10, Math.round(s.w/10));          // small weight bonus
      add(e.p,setXp); e.s.forEach(m=>add(m,Math.round(setXp*0.4)));
      if(s.reps<ex.reps[1]) allTop=false;
      topW=Math.max(topW,s.w);
      // PRs: best estimated 1RM per exercise
      const score=est1rm(s.w,s.reps), prev=S.prs[ex.ex];
      if(s.w>0 && (!prev || score>prev.score+0.01)){
        S.prs[ex.ex]={score,w:s.w,reps:s.reps,date:Date.now()}; S.prCount++;
        prs.push(e.name+" — "+fmtW(s.w)+" × "+s.reps); add(e.p,40);
      }
    });
    S.lastWeights[ex.ex]={w:topW,allTop,date:Date.now()};
    const cur=done.map(x=>({w:x.w,reps:x.reps})), prev=lastFor(ex.ex);
    if(prev && beatLast(prev.sets,cur)){ add(e.p,15); beat.push(e.name); }
    S.lastSets[ex.ex]={sets:cur,date:Date.now()};
  });
  if(!setsDone) return null;
  add("core",0); // ensure key exists harmlessly
  // completion bonus spread over trained muscles
  const trained=Object.keys(gained).filter(m=>gained[m]>0);
  trained.forEach(m=>add(m,Math.round(60/trained.length)));
  const beforeLvl = Object.fromEntries(MUSCLES.map(m=>[m.id,levelFromXp(S.xp[m.id]||0).lvl]));
  const beforeTotal=levelFromXp(totalXp(S)).lvl;
  Object.entries(gained).forEach(([m,v])=>{S.xp[m]=(S.xp[m]||0)+v});
  const levelUps = MUSCLES.filter(m=>levelFromXp(S.xp[m.id]||0).lvl>beforeLvl[m.id]).map(m=>m.name+" → Lv "+levelFromXp(S.xp[m.id]).lvl);
  const levelUpsDetail = MUSCLES.filter(m=>levelFromXp(S.xp[m.id]||0).lvl>beforeLvl[m.id]).map(m=>{ const to=levelFromXp(S.xp[m.id]).lvl, from=beforeLvl[m.id]; return {id:m.id,name:m.name,from,to,tier:tierFor(to),tierUp:tierFor(to).name!==tierFor(from).name}; });
  const afterTotal=levelFromXp(totalXp(S)).lvl;
  const w={id:Date.now(),date:Date.now(),name:active.name,dayIndex:active.dayIndex,volume:Math.round(volume),sets:setsDone,
           xp:Object.values(gained).reduce((a,b)=>a+b,0),exercises:active.exercises.map(ex=>({ex:ex.ex,sets:ex.sets.filter(s=>s.done)})),duration:Math.round((Date.now()-active.started)/60000)};
  S.workouts.push(w); S.active=null;
  const newAch=ACHIEVEMENTS.filter(a=>!S.achievements.includes(a.id)&&a.test(S)).map(a=>{S.achievements.push(a.id);return a});
  save();
  return {w,gained,prs,beat,levelUps,levelUpsDetail,newAch,overallUp:afterTotal>beforeTotal?afterTotal:null,overallFrom:beforeTotal};
}

async function syncHttp(url, opt={}){
  const req={url, method:opt.method||"GET", headers:Object.assign({"Content-Type":"application/json"},opt.headers||{}), body:opt.body==null?null:(typeof opt.body==="string"?opt.body:JSON.stringify(opt.body))};
  let status, text;

  else { let r; try{ r=await fetch(url,{method:req.method,headers:req.headers,body:req.body||undefined}); }catch(e){ throw new Error("offline"); } status=r.status; text=await r.text(); }
  let data=null; try{ data=text?JSON.parse(text):null; }catch(e){}
  return {status, data};
}
function syncErrMsg(code){
  const c=String(code||"");
  if(c.includes("EMAIL_EXISTS")) return "There's already a sync account with that email. Use Sign in instead.";
  if(c.includes("INVALID_LOGIN")||c.includes("INVALID_PASSWORD")||c.includes("EMAIL_NOT_FOUND")) return "Email or password doesn't match.";
  if(c.includes("WEAK_PASSWORD")) return "Password needs at least 6 characters.";
  if(c.includes("INVALID_EMAIL")) return "That doesn't look like an email address.";
  if(c.includes("TOO_MANY")) return "Too many attempts. Wait a few minutes and try again.";
  if(c.includes("OPERATION_NOT_ALLOWED")||c.includes("CONFIGURATION_NOT_FOUND")) return "Email/Password sign-in isn't switched on in your Firebase project yet (Authentication → Sign-in method).";
  if(c.includes("API key not valid")||c.includes("API_KEY_INVALID")) return "The Firebase config doesn't look right (API key). Paste it again.";
  if(c==="offline") return "No internet connection. FORGE will sync when you're back online.";
  if(c.includes("PERMISSION_DENIED")) return "Firebase refused access. Check the Firestore rules from the setup guide.";
  if(c.includes("NOT_FOUND")&&c.includes("database")) return "No Firestore database yet. Create one in Firebase (Firestore Database → Create database).";
  return "Sync problem: "+c.slice(0,140);
}

  const r=await syncHttp(SYNC_URL.auth+kind+"?key="+encodeURIComponent(cfg.apiKey),{method:"POST",body:{email,password,returnSecureToken:true}});
  if(r.status!==200) throw new Error(syncErrMsg(r.data&&r.data.error&&r.data.error.message));
  const a={email:r.data.email, uid:r.data.localId, idToken:r.data.idToken, refreshToken:r.data.refreshToken, exp:Date.now()+(Number(r.data.expiresIn)||3600)*1000-60000};
  localStorage.setItem(SYNC_AUTH_KEY,JSON.stringify(a)); return a;
}
async function syncToken(){
  const a=syncAuth(), cfg=syncCfg(); if(!a||!cfg) return null;

  const r=await syncHttp(SYNC_URL.token+"?key="+encodeURIComponent(cfg.apiKey),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(a.refreshToken)});
  if(r.status!==200){ const m=r.data&&r.data.error&&r.data.error.message||"TOKEN"; if(/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN/.test(m)){ localStorage.removeItem(SYNC_AUTH_KEY); throw new Error("Signed out: please sign in again."); } throw new Error(syncErrMsg(m)); }
  a.idToken=r.data.id_token; a.refreshToken=r.data.refresh_token||a.refreshToken; a.exp=Date.now()+(Number(r.data.expires_in)||3600)*1000-60000;

async function fsCall(a, path, opt={}){
  const r=await syncHttp(SYNC_URL.fs+path,Object.assign({},opt,{headers:{Authorization:"Bearer "+a.idToken}}));
  if(r.status>=400 && !(r.status===404&&opt.allow404)) throw new Error(syncErrMsg((r.data&&r.data.error&&(r.data.error.status+" "+r.data.error.message))||("HTTP "+r.status)));

function syncCore(){ const c={}; Object.keys(S).forEach(k=>{ if(k!=="workouts"&&!SYNC_LOCAL_ONLY.includes(k)) c[k]=S[k]; }); return c; }

// one full round: pull what changed elsewhere, merge, push what changed here
async function syncNow(opts={}){
  if(SYNC.busy){ SYNC.again=true; return; }
  const cfg=syncCfg(); if(!cfg||!syncAuth()){ SYNC.status="off"; syncUI(); return; }
  SYNC.busy=true; SYNC.status="syncing"; syncUI();
  try{
    const a=await syncToken(); const meta=syncMeta(); const user=fsUser(a);
    const coreRes=await fsCall(a, user+"/data/core",{allow404:true});
    const remote = coreRes.status===200 ? {updatedAt:Number(coreRes.data.fields.updatedAt.integerValue||0), core:JSON.parse(coreRes.data.fields.json.stringValue||"{}"), wids:(coreRes.data.fields.wids&&coreRes.data.fields.wids.stringValue||"").split(",").filter(Boolean)} : null;
    let changed=false, adopted=false;
    if(remote){
      // 1) workouts we don't have yet (workouts are only ever added, so a union never loses one)
      const have=new Set(S.workouts.map(w=>String(w.id))), missing=remote.wids.filter(id=>!have.has(id));
      for(let k=0;k<missing.length;k+=100){
        const r=await fsCall(a, fsRoot()+":batchGet",{method:"POST",body:{documents:missing.slice(k,k+100).map(id=>`${user}/workouts/${id}`)}});
        (r.data||[]).forEach(x=>{ if(x.found){ try{ S.workouts.push(JSON.parse(x.found.fields.json.stringValue)); changed=true; }catch(e){} } });
      }
      if(changed) S.workouts.sort((x,y)=>x.date-y.date);
    }
    // 2) everything else: did it really change here (content fingerprint) and/or on another device (account timestamp)?
    const dirty = coreHash()!==meta.hash;
    const remoteChanged = !!remote && remote.updatedAt>meta.base;
    if(remote && remote.core && remote.core.profile && !S.profile){ /* an empty device never overrides the account */ }
    if((remoteChanged && (!dirty || remote.updatedAt>=Number(S._editedAt||0))) || (remote && remote.core && remote.core.profile && !S.profile)){
      const keep={}; SYNC_LOCAL_ONLY.forEach(k=>keep[k]=S[k]);
      const wk=S.workouts; S=Object.assign(defaultState(), remote.core, keep, {workouts:wk}); changed=true; adopted=true;
    }
    // 3) push whatever the account is missing
    const remoteIds=new Set(remote?remote.wids:[]);
    const newW=S.workouts.filter(w=>!remoteIds.has(String(w.id)));
    const pushCore = !!S.profile && (!remote || (dirty && !adopted) || newW.length>0);
    let base = remoteChanged ? remote.updatedAt : meta.base;
    if(pushCore){
      const now=Math.max(Date.now(), (remote?remote.updatedAt:0)+1);
      const writes=newW.map(w=>({update:{name:`${user}/workouts/${w.id}`,fields:{json:{stringValue:JSON.stringify(w)},date:{integerValue:String(w.date||0)}}}}));
      writes.push({update:{name:`${user}/data/core`,fields:{json:{stringValue:JSON.stringify(syncCore())},updatedAt:{integerValue:String(now)},wids:{stringValue:S.workouts.map(w=>w.id).join(",")},device:{stringValue:(window.forge&&window.forge.desktop)?"PC":(/iPhone|iPad/.test(navigator.userAgent)?"iPhone":"browser")}}}});
      for(let k=0;k<writes.length;k+=400) await fsCall(a, fsRoot()+":commit",{method:"POST",body:{writes:writes.slice(k,k+400)}});
      base=now;
    }
    setSyncMeta(Object.assign(meta,{base, hash:coreHash(), at:Date.now()}));
    localStorage.setItem(KEY, JSON.stringify(S));
    SYNC.error=null; SYNC.status="ok"; SYNC.last=Date.now();
    if(changed && !opts.quiet) syncRefreshView();
  }catch(e){ SYNC.error=e.message||String(e); SYNC.status=/offline/.test(SYNC.error)||/No internet/.test(SYNC.error)?"offline":"error"; }
  finally{ SYNC.busy=false; syncUI(); if(SYNC.again){ SYNC.again=false; setTimeout(()=>syncNow(),300); } }
}

function cselHi(d){ const c=CSEL_OPEN; if(!c) return; const opts=[...c.menu.children]; let i=c.hi; do{ i=Math.max(0,Math.min(opts.length-1,i+d)); }while(opts[i].classList.contains("dis")&&i>0&&i<opts.length-1);
