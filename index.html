function cselReveal(menu,el){ if(el.offsetTop<menu.scrollTop) menu.scrollTop=el.offsetTop-6; else if(el.offsetTop+el.offsetHeight>menu.scrollTop+menu.clientHeight) menu.scrollTop=el.offsetTop+el.offsetHeight-menu.clientHeight+6; }
function enhanceSelects(root){
  (root||document).querySelectorAll("select:not([data-csel])").forEach(sel=>{
    sel.dataset.csel="1";
    const btn=document.createElement("button"); btn.type="button"; btn.className="csel"; btn.setAttribute("aria-haspopup","listbox"); btn.setAttribute("aria-expanded","false");
    if(sel.style.cssText) btn.style.cssText=sel.style.cssText;
    btn.innerHTML=`<span class="csel-txt">${esc(cselLabel(sel))}</span><svg class="csel-chev" viewBox="0 0 12 8" width="12" height="8"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    btn.onclick=e=>{ e.preventDefault(); if(CSEL_OPEN&&CSEL_OPEN.btn===btn) cselClose(); else cselOpen(sel,btn); };
    btn.onkeydown=e=>{
      if(!CSEL_OPEN||CSEL_OPEN.btn!==btn){ if(["ArrowDown","ArrowUp","Enter"," "].includes(e.key)){ e.preventDefault(); cselOpen(sel,btn);} return; }
      if(e.key==="ArrowDown"){e.preventDefault();cselHi(1);} else if(e.key==="ArrowUp"){e.preventDefault();cselHi(-1);}
      else if(e.key==="Enter"||e.key===" "){e.preventDefault();cselPick(sel,btn,CSEL_OPEN.hi);} else if(e.key==="Escape"||e.key==="Tab"){cselClose();} };
    sel.classList.add("csel-native"); sel.tabIndex=-1;
    sel.after(btn);
    sel._cselSync=()=>{ btn.querySelector(".csel-txt").textContent=cselLabel(sel); };
    sel.addEventListener("change",sel._cselSync);
  });
}
document.addEventListener("mousedown",e=>{ if(CSEL_OPEN&&!CSEL_OPEN.menu.contains(e.target)&&!CSEL_OPEN.btn.contains(e.target)) cselClose(); });
addEventListener("resize",cselClose);
document.addEventListener("scroll",e=>{ const c=CSEL_OPEN; if(!c||c.menu.contains(e.target)) return; const r=c.btn.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight||!c.btn.isConnected) cselClose(); else { const st=c.menu.scrollTop; cselPlace(c.menu,c.btn); c.menu.scrollTop=st; } },true);

// ---------- set-to-set progression (v1.33) ----------
// Research basis: autoregulating load from reps completed (APRE-style) matched or beat fixed loading (Zhang 2021; Larsen 2022);
// pyramids show no edge over straight sets, so FORGE keeps straight sets and only nudges the NEXT sets when a set lands well outside the range.
function nextSetAdjust(x, s){
  const e=EX[x.ex]; if(!s||!(s.w>0)||isBW(e)||TIMED.has(x.ex)) return null;
  const lo=x.reps[0], hi=x.reps[1], r=s.reps, j=jumpFor(e), cur=toD(s.w);
  let d=0, why="";
  if(r>=hi+3){ d=2*j; why="way above"; } else if(r>hi){ d=j; why="above"; }
  else if(r<=lo-3){ d=-Math.max(j,roundTo(cur*0.10,j)); why="well below"; } else if(r<lo){ d=-Math.max(j,roundTo(cur*0.05,j)); why="below"; }
  if(!d) return null;
  const nw=Math.max(j,roundTo(cur+d,j)); if(Math.abs(nw-cur)<1e-6) return null;
  return {w:fromD(nw), up:d>0, why, r, lo, hi};
}
function warmupFor(x, ei){
  if(S.profile&&S.profile.warmups===false) return "";
  const a=S.active; if(!a) return "";
  const first=a.exercises.findIndex(z=>{const e=EX[z.ex]; return e.t==="compound"&&!isBW(e)&&z.sets.length&&toD(z.sets[0].w)>=(isDumbbell(e)?(imperial()?20:10):(imperial()?40:20));});
  if(first!==ei) return "";
  const e=EX[x.ex], j=jumpFor(e), w=toD(x.sets[0].w), bar=(NEEDS[e.id]||[]).includes("barbell")?(imperial()?45:20):j;
  const a1=Math.max(bar,roundTo(w*0.5,j)), a2=Math.max(bar,roundTo(w*0.8,j)); if(a2>=w) return "";
  const u=wUnit(); return `<div class="wu" id="wu-${ei}">🔥 <b>Warm-up</b> (not logged): ${a1} ${u} × 8 → ${a2} ${u} × 3, then your working sets</div>`;
}
function effortTip(){
  const g=S.profile&&S.profile.goal;
  return g==="strength" ? "Effort: stop each set about 2–3 reps before you'd fail. Heavier weight drives strength more than grinding to failure."
       : "Effort: stop each set 1–3 reps before you'd fail. On the last set of an exercise you can push to 0–1; going close to failure builds the most muscle.";
}
function bindWorkout(){
  $$(".sets input").forEach(i=>i.onchange=()=>{const x=S.active.exercises[i.dataset.e], si=+i.dataset.s, s=x.sets[si];
    if(i.dataset.f==="w"){ const old=s.w, nw=wStore(i.value); s.w=nw;
      // carry the new weight down to later sets that haven't been done and still had the old weight
      x.sets.forEach((q,k)=>{ if(k>si && !q.done && sameW(q.w,old)){ q.w=nw; const inp=$(`.sets input[data-e="${i.dataset.e}"][data-s="${k}"][data-f="w"]`); if(inp) inp.value=wDisp(nw); } });
      const wu=$("#wu-"+i.dataset.e); if(wu&&si===0){ const h=warmupFor(x,+i.dataset.e); if(h) wu.outerHTML=h; else wu.remove(); }
    } else s.reps=Number(i.value)||0;

const effRest=sec=>Math.max(15,sec+(Number(S.profile&&S.profile.restOffset)||0));
function adjustRest(d){ const now=Date.now(); if(!restEnd||restEnd<now) restEnd=now; restEnd=Math.max(now,restEnd+d*1000); clearInterval(timerInt); timerInt=setInterval(tickTimer,250); tickTimer(); }
function skipRest(){ restEnd=null; clearInterval(timerInt); $$(".timer-val").forEach(el=>{ el.textContent="—"; el.style.color=""; }); }
function startRest(sec){ sec=effRest(sec); restEnd=Date.now()+sec*1000; clearInterval(timerInt); timerInt=setInterval(tickTimer,250); tickTimer(); }
function tickTimer(){ const el=$("#timer"), els=$$(".timer-val"); if(!el){clearInterval(timerInt);return;} if(!restEnd){els.forEach(x=>{x.textContent="—";x.style.color="";});return;} const left=Math.max(0,Math.round((restEnd-Date.now())/1000)); els.forEach(x=>{x.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; x.style.color=left===0?"var(--accent)":"";}); if(left===0){clearInterval(timerInt); if(el.dataset.beeped!=="1"){el.dataset.beeped="1"; if(S.profile.restSound!==false) beep();} } else el.dataset.beeped="0"; }
function beep(){ try{const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination); o.frequency.value=880; g.gain.value=.08; o.start(); o.stop(c.currentTime+.18);}catch(e){} }
function addSet(ei){const e=S.active.exercises[ei]; const l=e.sets[e.sets.length-1]; e.sets.push({w:l?l.w:0,reps:l?l.reps:e.reps[0],done:false}); save(); render();}
function removeSet(ei){const e=S.active.exercises[ei]; if(e.sets.length>1){e.sets.pop();save();render();}}
async function cancelWorkout(){ if(await askConfirm({title:"Discard this workout?",body:"Nothing from this session will be saved: no sets, XP or PRs.",ok:"Discard",cancel:"Keep going",danger:true,icon:"🗑️"})){S.active=null;restEnd=null;clearInterval(timerInt);save();go("dashboard");} }
function swapExercise(ei){
  const cur=EX[S.active.exercises[ei].ex]; const alts=EXERCISES.filter(e=>e.p===cur.p&&e.id!==cur.id&&kitAllows(userKit(),e));
  modal(`<h2>Swap ${cur.name}</h2><p class="muted small" style="margin:6px 0 14px">Same muscle, different movement.</p><div class="col">${alts.map(e=>`<button class="btn" style="justify-content:space-between" onclick="doSwap(${ei},'${e.id}')"><span>${e.name}</span><span class="muted small">${e.t}</span></button>`).join("")||'<span class="muted">No alternatives with your equipment. Add more kit in Settings.</span>'}</div>`);
}
function swapCore(ei,id){ const e=S.active.exercises[ei]; e.ex=id; e.sug=suggestFor(id,e.reps,e.sets.length); const w=e.sug?e.sug.w:0; e.sets.forEach((s,i)=>{if(!s.done){s.w=w; s.reps=e.sug&&e.sug.targets?e.sug.targets[i]:e.reps[0];}}); }

// If a session already contains the harder version, that copy moves up too (or to another exercise for
// the same muscle), so the upgrade never leaves the same exercise twice in one session.
function bumpReplacement(list,to,from){
  const kit=userKit(), has=id=>list.some(x=>x.ex===id), nx=NEXT_BW[to];
  if(nx && kitAllows(kit,EX[nx]) && !has(nx)) return nx;
  const alt=EXERCISES.find(e=>e.p===EX[to].p && e.id!==to && e.id!==from && kitAllows(kit,e) && !has(e.id));
  return alt?alt.id:null;
}
function applyUpgrade(list,from,to){
  const i=list.findIndex(x=>x.ex===from); if(i<0) return;
  const j=list.findIndex(x=>x.ex===to);
  if(j>=0){ const r=bumpReplacement(list,to,from); if(!r) return; list[j].ex=r; }
  list[i].ex=to;
}
// bodyweight progression: swap in the harder version now AND in the plan from here on
function upgradeExercise(ei){
  const e=S.active.exercises[ei], from=e.ex, to=e.sug&&e.sug.upgrade; if(!to) return;
  S.plan.days.forEach(d=>applyUpgrade(d.exercises,from,to));
  const j=S.active.exercises.findIndex(x=>x.ex===to);
  if(j>=0){ const r=bumpReplacement(S.active.exercises,to,from); if(r) swapCore(j,r); }
  swapCore(ei,to); save(); render();
  toast("⬆ "+EX[from].name+" → "+EX[to].name+" (plan updated)");
}
function completeWorkout(){

const CHECKIN_REASONS=[["time","Short on time"],["tired","Too tired / sore"],["hard","Weights too heavy"],["equipment","Equipment busy / missing"],["pain","Pain or discomfort"],["offday","Just an off day"]];
function checkinHtml(wid,done,planned){
  return `<div class="card" style="margin-top:14px;background:var(--bg2)" id="ci"><h3>Didn't get through it all?</h3>

}
function logCheckin(wid,reason,action){
  let c=S.checkins.find(x=>x.workoutId===wid);
  if(!c){ c={date:Date.now(),workoutId:wid,reason:null,action:null}; S.checkins.push(c); }
  if(reason) c.reason=reason; if(action) c.action=action;
  const w=S.workouts.find(x=>x.id===wid); if(w) w.checkin={reason:c.reason,action:c.action};
  save();
}
function checkin(wid,reason){
  $$("#ci .choice button").forEach((b,i)=>b.classList.toggle("on",CHECKIN_REASONS[i][0]===reason));
  logCheckin(wid,reason);
  const adj=Number(S.profile.volumeAdj)||0, btn=(a,l,primary)=>`<button class="btn sm ${primary?'primary':''}" onclick="checkinAction(${wid},'${a}')">${l}</button>`;
  const R={
    time:   [`No problem. Want shorter sessions? I'll take one set off every exercise, which saves roughly 10–15 minutes.`, adj<=-2?[]:[btn("shorter","Make sessions shorter",1)]],
    tired:  [`Fatigue happens: sleep, food and stress all count. If it keeps happening, a bit less volume helps you recover between sessions.`, adj<=-2?[]:[btn("shorter","Reduce volume (−1 set per exercise)",1)]],
    hard:   [`Then the weights were probably too heavy for the reps. I can lower the weights for the exercises in this session by 10% for next time.`, [btn("lighter","Lower these weights 10%",1)]],
    equipment:[`Use the ⇄ button on any exercise to swap to an alternative mid-workout. If you usually train with less kit, change your equipment setting and I'll rebuild the plan around it.`, [btn("settings","Change equipment")]],
    pain:   [`Stop any exercise that hurts. Sharp or joint pain isn't something to push through. Next time swap that movement with ⇄, and if it continues, get it checked by a GP or physio.`, []],
    offday: [`Everyone has them. Your plan stays exactly the same.`, []],
  }[reason];

  $("#ci_out").innerHTML=`<div class="note" style="margin-top:12px">${R[0]}</div><div class="row wrap" style="margin-top:10px;gap:8px">${R[1].join("")}${R[1].length?btn("keep","Keep as is"):''}</div>`;
}
function checkinAction(wid,action){
  logCheckin(wid,null,action);
  let msg="Got it, no changes.";
  if(action==="shorter"){ S.profile.volumeAdj=Math.max(-2,(Number(S.profile.volumeAdj)||0)-1); S.plan=generatePlan(S.profile,S.plan.seed||1); msg="Done. Every exercise now has one set fewer. You can change this any time in Settings → Session size."; }

// ----- Live updates (desktop shell only) -----
let UPD = {desktop:false, running:APP_VERSION, bundled:null, available:null, maintenance:[], checkedAt:null};
// is a restart needed to install the pending update? (program-file updates, or an older desktop shell without live install)
const needsRestart=()=>!!(UPD.available && (UPD.available.exe || !(window.forge && forge.install)));
async function installUpdate(btn){
  if(!UPD.available) return;
  if(btn){ btn.disabled=true; btn.textContent= needsRestart()?"Restarting…":"Installing…"; }
  if(needsRestart()) return forge.apply();
  const ok=await forge.install();          // shell swaps in the new app file and reloads this window
  if(!ok && btn){ btn.disabled=false; toast("Couldn't install, try Check for updates again"); renderNavUpdate(); }
}
function installLabel(){ return UPD.available ? (needsRestart()?"⬆ Install & restart v":"⬆ Install v")+esc(UPD.available.version) : ""; }
function renderNavUpdate(){
  const el=$("#navupd"); if(!el) return;
  $("#navver").textContent="v"+APP_VERSION+(UPD.checkedAt&&!UPD.available?" · up to date":"");
  if(!window.forge){ el.innerHTML=""; return; }
  el.innerHTML = UPD.available
    ? `<button class="ready" onclick="installUpdate(this)" title="${needsRestart()?'FORGE will close and reopen on the new version':'Switches to the new version straight away, no restart'}">${installLabel()}</button>`
    : `<button onclick="navCheck(this)">↻ Check for updates</button>`;
}
async function navCheck(btn){ btn.textContent="Checking…"; btn.disabled=true; await refreshUpdateInfo(true); if(!UPD.available) toast("You're on the latest version (v"+APP_VERSION+")"); }
async function refreshUpdateInfo(check){
  if(!window.forge) return;
  try{ const i = check ? await forge.check() : await forge.info(); UPD=Object.assign(UPD,i); }catch(e){}
  renderNavUpdate(); if(page==="patchnotes"||page==="settings") render();
}
if(window.forge){ refreshUpdateInfo(false); forge.onUpdate(i=>{ UPD=Object.assign(UPD,i); renderNavUpdate(); if(page==="patchnotes") render(); }); }

// best known 1RM estimate: PRs, logged sets and past max tests
function bestE1rm(id){ const p=S.prs[id], t=latestTest(id); return Math.max(p?p.score:0, t?t.e1rm:0, ...exHistory(id).map(h=>h.e1rm), 0); }
function latestTest(id){ const t=(S.maxTests||{})[id]; return t&&t.length?t[t.length-1]:null; }
function maxTestModal(pref){

  const id=pref&&EX[pref]&&!isBW(EX[pref])&&kitAllows(userKit(),EX[pref])?pref:(opts.find(e=>e.id==="bench")||opts[0]).id;
  modal(`<h2>🎯 Test your max</h2><p class="small muted" style="margin:4px 0 12px">Work up to one heavy set of 1–5 reps. FORGE works out your 1RM from it and uses it to set your working weights.</p>

      <tr><td><b>Test</b></td><td><b>${est?ld(1)+"+":"~100%"}</b></td><td><b>1–5</b></td><td>3–5 min between attempts</td></tr></table></div>`; };

// ---------- strength history & chart ----------
function exHistory(id){
  const pts=[];
  S.workouts.forEach(w=>(w.exercises||[]).forEach(x=>{ if(x.ex!==id) return; const sets=(x.sets||[]).filter(z=>z.reps>0); if(!sets.length) return;
    pts.push({date:w.date, e1rm:Math.max(...sets.map(z=>z.w>0?est1rm(z.w,z.reps):0)), top:Math.max(...sets.map(z=>z.w)), vol:sets.reduce((t,z)=>t+z.w*z.reps,0), reps:Math.max(...sets.map(z=>z.reps))}); }));
  return pts.sort((a,b)=>a.date-b.date);
}
function loggedExercises(){ const c={}; S.workouts.forEach(w=>(w.exercises||[]).forEach(x=>{ if((x.sets||[]).some(z=>z.reps>0)) c[x.ex]=(c[x.ex]||0)+1; })); Object.keys(S.maxTests||{}).forEach(k=>{c[k]=c[k]||0;}); return Object.keys(c).filter(k=>EX[k]).sort((a,b)=>c[b]-c[a]); }
let CHART={ex:null,metric:"e1rm"};
function lineChart(pts,fmt,tests){
  const all=pts.map(p=>p.y).concat((tests||[]).map(t=>t.y));
  if(!all.length) return `<div class="muted small" style="padding:20px 0">No data yet.</div>`;
  const compact=page==="progress"&&innerWidth>=1280&&innerHeight>=680; const W=compact?420:720,H=compact?300:230,L=compact?58:64,R=16,T=14,B=30;
  const xs=pts.map(p=>p.x).concat((tests||[]).map(t=>t.x)); let x0=Math.min(...xs), x1=Math.max(...xs); if(x1===x0){x0-=864e5;x1+=864e5;}
  let y0=Math.min(...all), y1=Math.max(...all); const pad=(y1-y0)*0.15||Math.max(1,y1*0.1); y0=Math.max(0,y0-pad); y1+=pad;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const grid=[0,1,2,3].map(i=>{const v=y0+(y1-y0)*i/3; return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v)}</text>`;}).join("");
  const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ");
  const dl=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
  const xl=[x0,(x0+x1)/2,x1].map((t,i)=>`<text x="${X(t)}" y="${H-8}" text-anchor="${['start','middle','end'][i]}" font-size="11" fill="var(--muted)">${dl(t)}</text>`).join("");
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="var(--accent)"><title>${dl(p.x)}: ${fmt(p.y)}</title></circle>`).join("");
  const dia=(tests||[]).map(t=>{const cx=X(t.x),cy=Y(t.y);return `<path d="M${cx},${cy-7} L${cx+7},${cy} L${cx},${cy+7} L${cx-7},${cy} Z" fill="var(--warn)"><title>Max test ${dl(t.x)}: ${fmt(t.y)}</title></path>`;}).join("");
  return `<svg class="chartsvg" viewBox="0 0 ${W} ${H}">${grid}${pts.length>1?`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:''}${dots}${dia}${xl}</svg>`;
}
function strengthCard(){
  const list=loggedExercises();
  if(!list.length) return `<div class="card" style="margin-bottom:12px"><div class="row between"><h3>Strength progress</h3><button class="btn sm" onclick="maxTestModal()">🎯 Test a max</button></div><span class="muted">Log a few workouts and your strength graphs will appear here.</span></div>`;
  if(!CHART.ex||!list.includes(CHART.ex)) CHART.ex=list[0];
  const e=EX[CHART.ex], h=exHistory(CHART.ex), bw=isBW(e)&&h.every(p=>p.top<=0)&&!latestTest(CHART.ex);
  const metric=bw?"reps":CHART.metric;
  const pts=h.map(p=>({x:p.date,y:metric==="e1rm"?toD(p.e1rm):metric==="top"?toD(p.top):metric==="vol"?toD(p.vol):p.reps}));
  const tests=metric==="e1rm"?((S.maxTests||{})[CHART.ex]||[]).map(t=>({x:t.date,y:toD(t.e1rm)})):[];
  const unit=metric==="reps"?(TIMED.has(CHART.ex)?" s":" reps"):" "+wUnit();
  const fmt=v=>(metric==="vol"?Math.round(v).toLocaleString():Math.round(v*10)/10)+unit;
  let change=""; if(pts.length>1){ const a=pts[0].y,b=pts[pts.length-1].y, d=b-a, days=Math.round((pts[pts.length-1].x-pts[0].x)/864e5);
    change=`<span class="pill ${d>0?'acc':''}">${d>=0?'+':''}${metric==="vol"?Math.round(d).toLocaleString():Math.round(d*10)/10}${unit}${a>0?` (${d>=0?'+':''}${Math.round(d/a*100)}%)`:''} over ${days} day${days===1?'':'s'}</span>`; }
  const t=latestTest(CHART.ex);
  return `<div class="card" style="margin-bottom:12px"><div class="row between wrap" style="gap:8px;margin-bottom:10px"><h3 style="margin:0">Strength progress</h3>
    <div class="row wrap" style="gap:8px"><select id="ch_ex" style="width:auto">${list.map(k=>`<option value="${k}" ${k===CHART.ex?'selected':''}>${EX[k].name}</option>`).join("")}</select>
    ${bw?'':`<div class="seg" id="ch_metric">${[["e1rm","Est. 1RM"],["top","Top weight"],["vol","Volume"]].map(([k,l])=>`<button data-k="${k}" class="${metric===k?'on':''}">${l}</button>`).join("")}</div>`}
    <button class="btn sm" onclick="maxTestModal(CHART.ex)">🎯 Test a max</button></div></div>
    <div class="chartwrap">${lineChart(pts,fmt,tests)}</div>
    <div class="row wrap small muted" style="gap:10px;margin-top:6px">${change}<span>${h.length} session${h.length===1?'':'s'} logged</span>${t?`<span><span style="color:var(--warn)">◆</span> Tested max: <b style="color:var(--text)">${fmtW(t.w)} × ${t.reps}</b> → ${fmtW(t.e1rm)} 1RM (${new Date(t.date).toLocaleDateString()})</span>`:''}<a href="#" onclick="guideModal(CHART.ex);return false" style="color:var(--accent)">How to do it</a></div></div>`;
}

// ---------- progress photos (IndexedDB: kept out of the main save so it never gets too big) ----------
const PhotoDB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((res,rej)=>{ const r=indexedDB.open("forge_photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"}); r.onsuccess=()=>{this.db=r.result;res(this.db);}; r.onerror=()=>rej(r.error); }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("photos",mode), st=t.objectStore("photos"), q=fn(st); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }); },
  async all(){ const r=await this.tx("readonly",st=>st.getAll()); return (r||[]).sort((a,b)=>a.date-b.date); },
  put(p){ return this.tx("readwrite",st=>st.put(p)); }, del(id){ return this.tx("readwrite",st=>st.delete(id)); }, clear(){ return this.tx("readwrite",st=>st.clear()); },
};
function resizeImage(file,max=1080){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.85)); }; img.onerror=rej; img.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }

// ---------- body map renderer (v1.19) ----------
const BODY_SKIP_BADGES={front:["back","triceps"],back:[]};   // too small to badge in that view
function artFibres(x,y,w,h,ang,step){
  const t=ang*Math.PI/180, ux=Math.cos(t), uy=Math.sin(t), nx=-uy, ny=ux;
  const cx=x+w/2, cy=y+h/2, D=Math.hypot(w,h)/2+4, f=v=>v.toFixed(1); let dark="", light="";
  for(let k=-D;k<=D;k+=step){
    const px=cx+nx*k, py=cy+ny*k, bow=Math.sin(k*0.11)*step*0.45;
    const ax=px-ux*D, ay=py-uy*D, bx=px+ux*D, by=py+uy*D, qx=px+nx*bow, qy=py+ny*bow, o=step*0.38;
    dark+=`M${f(ax)},${f(ay)}Q${f(qx)},${f(qy)} ${f(bx)},${f(by)}`;
    light+=`M${f(ax+nx*o)},${f(ay+ny*o)}Q${f(qx+nx*o)},${f(qy+ny*o)} ${f(bx+nx*o)},${f(by+ny*o)}`;
  }
  return {dark,light};
}
const ART_CACHE={};
let BODY_UID=0;
function bodyView(view, opts, dx){
  const A=BODY_ART[view], uid=view+"-"+(++BODY_UID), [vx,vy]=A.vb;
  const cache=ART_CACHE[view]||(ART_CACHE[view]=A.parts.map(([k,d,x,y,w,h,ang])=>artFibres(x,y,w,h,ang,6.5)));
  const shapes=A.parts.map(([k,d,x,y,w,h],i)=>{
    let fill="#4b5462", op=1, attrs="", tip="";
    if(k==="hair"){ fill="#22272f"; }
    else if(k){ const L=levelFromXp(S.xp[k]||0), t=tierFor(L.lvl); fill=t.color; op=L.lvl<=1&&!(S.xp[k]>0)?1:(0.68+0.32*L.pct);
      attrs=`class="bm-r" data-m="${k}"`; tip=`<title>${MUSCLE_NAME[k]} · Lv ${L.lvl} ${t.name} · ${L.into}/${L.need} XP to Lv ${L.lvl+1}</title>`; }
    const fb=cache[i], texture=k!=="hair";
    return `<path ${attrs} d="${d}" fill="${fill}" fill-opacity="${op.toFixed(2)}">${tip}</path>`+
      (texture?`<clipPath id="ac-${uid}-${i}"><path d="${d}"/></clipPath><g clip-path="url(#ac-${uid}-${i})" pointer-events="none"><path d="${fb.dark}" fill="none" stroke="#000" stroke-opacity="${k?.34:.4}" stroke-width="2"/><path d="${fb.light}" fill="none" stroke="#fff" stroke-opacity="${k?.16:.07}" stroke-width="1.2"/><path d="${d}" fill="url(#bm-shade)"/></g>`:"")+
      `<path d="${d}" fill="none" stroke="#07090c" stroke-width="2.2" stroke-linejoin="round" pointer-events="none"/>`;
  }).join("");
  const badges=opts.badges===false?"":Object.entries(BODY_ART_BADGES[view]).filter(([m])=>!BODY_SKIP_BADGES[view].includes(m)).flatMap(([m,pts])=>{
    const L=levelFromXp(S.xp[m]||0), t=tierFor(L.lvl);
    return pts.map(([x,y])=>`<g class="bm-b"><circle cx="${x}" cy="${y}" r="21" fill="#060c18" fill-opacity=".85" stroke="${t.color}" stroke-width="3.5"/><text x="${x}" y="${y+9}" text-anchor="middle" font-size="25" font-weight="800" fill="${t.color}">${L.lvl}</text></g>`); }).join("");
  return `<g transform="translate(${dx-vx},${-vy+10})">${shapes}${badges}
    <text x="${vx+A.vb[2]/2}" y="${vy+A.vb[3]+48}" text-anchor="middle" font-size="30" fill="var(--muted)" letter-spacing="4">${view.toUpperCase()}</text></g>`;
}
function bodyMap(opts={}){
  const F=BODY_ART.front.vb, B=BODY_ART.back.vb, gap=70, W=F[2]+gap+B[2], H=Math.max(F[3],B[3])+70;
  const legend=TIERS.map(([min,name,c],i)=>{ const max=TIERS[i+1]?TIERS[i+1][0]-1:null;
    return `<span class="row" style="gap:5px;font-size:12px"><i style="width:10px;height:10px;border-radius:3px;background:${c};display:inline-block"></i>${name}<span class="muted">${min===1?"Lv 1":max?`Lv ${min}–${max}`:`Lv ${min}+`}</span></span>`; }).join("");
  return `<svg class="bodymap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body map of muscle levels"><defs><radialGradient id="bm-shade" cx=".42" cy=".32" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient></defs>
    ${bodyView("front",opts,0)}${bodyView("back",opts,F[2]+gap)}</svg>
    ${opts.legend===false?"":`<div class="row wrap" style="gap:10px;justify-content:center;margin-top:8px">${legend}</div>`}`;
}

function renderPatch(){

  <div class="card changelog">${CHANGELOG.map(c=>`<div class="entry"><div class="row between"><h2>v${c.version} — ${c.title}</h2><span class="muted small">${c.date}</span></div><ul>${c.notes.map(([t,n])=>`<li><span class="tag ${t}">${t}</span>${n}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="grid2" style="margin-top:14px">
    <div class="card"><h3>Updates</h3>${UPD.desktop?`
      <div class="small" style="margin-bottom:10px">Running <b>v${esc(UPD.running)}</b> <span class="muted">(${UPD.source==='updates'?'from update channel':'bundled in exe'})</span> · exe bundles v${esc(UPD.bundled)}${UPD.checkedAt?` · checked ${new Date(UPD.checkedAt).toLocaleTimeString()}`:''}</div>
      ${UPD.available?`<div class="note" style="margin-bottom:10px">⬆ <b>v${esc(UPD.available.version)}${UPD.available.title?' — '+esc(UPD.available.title):''}</b> is ready${needsRestart()?' <span class="pill">needs a restart</span>':' <span class="pill acc">installs instantly</span>'}.<ul class="changelog" style="margin:6px 0 8px 2px">${(UPD.available.notes||[]).map(([t,n])=>`<li><span class="tag ${t}">${t}</span>${esc(n)}</li>`).join("")}</ul><button class="btn primary sm" onclick="installUpdate(this)">${installLabel()}</button></div>`:`<div class="small muted" style="margin-bottom:10px">You're on the latest version. The app checks the update channel every minute.</div>`}
      <div class="row"><button class="btn sm" onclick="refreshUpdateInfo(true);toast('Checking…')">↻ Check for updates</button><button class="btn sm" onclick="forge.openUpdates()">Open updates folder</button></div>`
      :`<div class="small muted">Live updates run in the desktop app (FORGE.exe). In the browser, you're always running whatever this file is.</div>`}</div>
    <div class="card"><h3>Maintenance log</h3>${UPD.maintenance.length?UPD.maintenance.slice().reverse().map(m=>`<div class="maint"><div class="row between"><b>${esc(m.summary||'Maintenance')}</b><span class="muted small">${esc(m.date||'')}</span></div><div class="small muted">v${esc(m.version||'')}${m.by?' · by '+esc(m.by):''}</div>${(m.actions||[]).length?`<ul>${m.actions.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:''}</div>`).join(""):`<div class="small muted">No maintenance runs recorded yet.${UPD.desktop?'':' (Shown in the desktop app.)'}</div>`}</div>
  </div>`;
}
function whatsNew(){
  if(!S.profile || S.seenVersion===APP_VERSION) return;
  const c=CHANGELOG[0];
  modal(`<div class="tiny accent">What's new</div><h1>v${c.version} — ${c.title}</h1><ul class="changelog" style="margin:14px 0">${c.notes.map(([t,n])=>`<li><span class="tag ${t}">${t}</span>${n}</li>`).join("")}</ul><button class="btn primary block" onclick="closeModal()">Got it</button>`);
  S.seenVersion=APP_VERSION; save();
}

      ${syncCard()}
      <div class="card"><h3>Workout</h3><div class="col">
        <div class="field"><label class="label">Rest times</label><select id="s_restOffset">${[-30,-15,0,15,30,60].map(v=>`<option value="${v}" ${v==(Number(p.restOffset)||0)?'selected':''}>${v===0?'Plan default':(v>0?'+':'−')+Math.abs(v)+' s on every rest'}</option>`).join("")}</select></div>
        <div class="grid2"><div class="field"><label class="label">Timer sound</label><select id="s_restSound"><option value="1" ${p.restSound!==false?'selected':''}>On</option><option value="0" ${p.restSound===false?'selected':''}>Off</option></select></div>
        <div class="field"><label class="label">Start timer when I tick a set</label><select id="s_restAuto"><option value="1" ${p.restAuto!==false?'selected':''}>Yes</option><option value="0" ${p.restAuto===false?'selected':''}>No</option></select></div></div>
        <div class="grid2"><div class="field"><label class="label">Adjust the next set from my reps</label><select id="s_autoAdjust"><option value="1" ${p.autoAdjust!==false?'selected':''}>On</option><option value="0" ${p.autoAdjust===false?'selected':''}>Off</option></select></div>
        <div class="field"><label class="label">Warm-up sets before the first big lift</label><select id="s_warmups"><option value="1" ${p.warmups!==false?'selected':''}>Show</option><option value="0" ${p.warmups===false?'selected':''}>Hide</option></select></div></div>
        <div class="small muted">These apply straight away. During a workout use −15 / +15 / Skip under the timer.</div></div></div>
      <div class="card"><h3>Backup</h3><p class="small muted" style="margin-bottom:10px">Your data (including progress photos) lives on this PC. Export a backup file now and then — it's the only copy.</p>
        <div class="row"><button class="btn" id="s_export">⤓ Export backup</button><label class="btn" style="cursor:pointer">⤒ Import backup<input type="file" id="s_import" accept=".json" style="display:none"></label></div></div>
      <div class="card"><h3>About</h3><div class="small muted">FORGE v${APP_VERSION}${UPD.desktop?' · desktop':' · browser'} · built for ${esc(p.name)} · ${S.workouts.length} workouts · ${totalXp(S).toLocaleString()} XP<br>Profile created ${new Date(p.created).toLocaleDateString()}<br><br><b>Credits</b><br>Body-map anatomy artwork from react-native-body-highlighter, © 2022 ELABBASSI Hicham, used under the MIT licence (see THIRD-PARTY-NOTICES.md).</div></div>
      <div class="card"><h3 style="color:var(--danger)">Danger zone</h3><button class="btn danger" id="s_reset">Reset everything</button></div>
    </div></div>`;
}
let SKIT=[];   // equipment being edited on the Settings screen
function bindSettings(){
  $("#s_restOffset").onchange=e=>{S.profile.restOffset=Number(e.target.value); save(); toast("Rest times updated");};
  $("#s_restSound").onchange=e=>{S.profile.restSound=e.target.value==="1"; save(); toast("Timer sound "+(S.profile.restSound?"on":"off"));};
  bindSyncCard();
  $("#s_autoAdjust").onchange=e=>{S.profile.autoAdjust=e.target.value==="1"; save(); toast(S.profile.autoAdjust?"Next-set adjustments on":"Next-set adjustments off");};
  $("#s_warmups").onchange=e=>{S.profile.warmups=e.target.value==="1"; save(); toast(S.profile.warmups?"Warm-up sets shown":"Warm-up sets hidden");};
  $("#s_restAuto").onchange=e=>{S.profile.restAuto=e.target.value==="1"; save(); toast(S.profile.restAuto?"Timer starts when you tick a set":"Timer won't start automatically");};
  const kitRedraw=()=>{ $("#s_kitbox").innerHTML=kitPicker("s_kit",SKIT); bindKitPicker("s_kit",SKIT,kitRedraw); };
  bindKitPicker("s_kit",SKIT,kitRedraw);
  // switching units re-draws the height/weight boxes in the new units without losing what's typed
  const redraw=()=>{ const box=$("#s_body"), v=readBody("s",{w:box.dataset.w,h:box.dataset.h}), nu={w:$("#s_wUnit").value,h:$("#s_hUnit").value};
    box.innerHTML=bodyFields("s",nu,v.height,v.weight); box.dataset.w=nu.w; box.dataset.h=nu.h; };
  $("#s_wUnit").onchange=redraw; $("#s_hUnit").onchange=redraw;
  $("#s_save").onclick=()=>{ const p=S.profile; p.name=$("#s_name").value.trim()||p.name; p.age=Number($("#s_age").value); const box=$("#s_body"); Object.assign(p,readBody("s",{w:box.dataset.w,h:box.dataset.h})); p.wUnit=$("#s_wUnit").value; p.hUnit=$("#s_hUnit").value;
    ["bodyType","goal","experience"].forEach(k=>p[k]=$("#s_"+k).value); p.kit=[...SKIT]; delete p.equipment; p.days=Number($("#s_days").value); p.volumeAdj=Number($("#s_volumeAdj").value);
    { const ju=$("#s_jump_bar").dataset.unit; p.jumps=p.jumps||{}; p.jumps[ju]={bar:Number($("#s_jump_bar").value), db:Number($("#s_jump_db").value)}; }
    S.plan=generatePlan(p,Date.now()); save(); toast("Saved — plan rebuilt"); go("plan"); };
  $("#s_export").onclick=async()=>{ let photos=[]; try{ photos=await PhotoDB.all(); }catch(e){} const blob=new Blob([JSON.stringify(Object.assign({},S,{_photos:photos}),null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`forge-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); toast("Backup downloaded"); };
  $("#s_import").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async()=>{ try{ const d=JSON.parse(r.result); if(!d.profile) throw 0; if(await askConfirm({title:"Restore this backup?",body:"All current data is replaced with the backup: profile, XP, history and photos.",ok:"Restore",danger:true,icon:"📥"})){ const ph=d._photos||[]; delete d._photos; S=Object.assign(defaultState(),d); save();
          (async()=>{ try{ await PhotoDB.clear(); for(const p of ph) await PhotoDB.put(p); }catch(e){} render(); toast("Backup restored"+(ph.length?` (${ph.length} photos)`:"")); })(); } }catch(err){ toast("That file isn't a FORGE backup"); } }; r.readAsText(f); };
  $("#s_reset").onclick=async()=>{ if(await askConfirm({title:"Delete all data?",body:"Your profile, XP, history, PRs and photos are deleted from this device. This can't be undone."+(syncAuth()?" This device is also signed out of sync, so your sync account is not touched.":""),ok:"Continue",danger:true}) && await askConfirm({title:"Really sure?",body:"Last chance. Consider exporting a backup first.",ok:"Delete everything",danger:true,icon:"🔥"})){ syncSignOut(); localStorage.removeItem(KEY); PhotoDB.clear().catch(()=>{}); S=defaultState(); onbStep=0; onb={}; render(); } };
}

// ---------- 6. BOOT ----------
// start-up migrations below may change stored data; if this device was in step with the sync account before
// starting, those automatic changes must not make it look "edited" (otherwise it could overwrite newer data)
setTimeout(()=>{ try{ if(S_RAW0 && syncAuth()){ const m=syncMeta(); const before=Object.assign(defaultState(),JSON.parse(S_RAW0)); const c={}; Object.keys(before).forEach(k=>{ if(k!=="workouts"&&!SYNC_LOCAL_ONLY.includes(k)) c[k]=before[k]; });
  if(m.hash && m.hash===syncHash(JSON.stringify(c))){ m.hash=coreHash(); setSyncMeta(m); } } }catch(e){ console.warn("sync boot",e); } },0);
setTimeout(()=>{ if(syncAuth()&&syncCfg()) syncNow(); },800);
// v1.37: installable phone app (only when served over https, never in the desktop app)
if("serviceWorker" in navigator && location.protocol==="https:"){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw",e))); }
document.documentElement.classList.toggle("standalone", !!(navigator.standalone || (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)));
// v1.32: anyone whose equipment was the whole old "Full gym" list also has the new machines
try{ if(S.profile && Array.isArray(S.profile.kit) && !S.profile.kitV132){ if(KIT_V131.every(k=>S.profile.kit.includes(k))) KIT.forEach(([k])=>{ if(!S.profile.kit.includes(k)) S.profile.kit.push(k); }); S.profile.kitV132=true; save(); } }catch(e){ console.error("kit migration failed", e); }
// v1.13: top up short sessions in existing plans (keeps every existing exercise)
try{ if(S.profile && S.plan && !S.plan.v113){ S.plan.days.forEach(d=>topUpDay(d.name,d.exercises,S.profile)); S.plan.v113=true; save(); } }catch(e){ console.error("top-up failed", e); }
// v1.11: build "last time" records from workout history for people who trained before this version
if(S.workouts.length && (!S.lastSets || !Object.keys(S.lastSets).length)){ S.lastSets={};
  S.workouts.forEach(w=>(w.exercises||[]).forEach(x=>{ const sets=(x.sets||[]).filter(z=>z.reps>0).map(z=>({w:z.w,reps:z.reps})); if(sets.length) S.lastSets[x.ex]={sets,date:w.date}; })); save(); }
// v1.9: broad "equipment" choice → equipment checklist (existing plan is left untouched)
if(S.profile && !Array.isArray(S.profile.kit)){ S.profile.kit=[...({gym:KIT_PRESETS.gym,dumbbell:KIT_PRESETS.home,body:KIT_PRESETS.none}[S.profile.equipment]||KIT_PRESETS.gym).kit]; delete S.profile.equipment; save(); }
// v1.5: re-tune existing plans for age with the SAME seed, so exercise choices stay identical.
// (Runs here, after all constants exist; running it at load time crashed on GOALS.)
try{ if(S.profile && S.plan && !S.plan.v15){ S.plan=generatePlan(S.profile, S.plan.seed||1); save(); } }catch(e){ console.error("plan migration failed", e); }
render(); whatsNew();
</script>
</body>
